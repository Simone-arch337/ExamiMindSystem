<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國家考試智慧備考系統 ExamiMind (全頁面功能完全修復版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- 引入開源前端 OCR 庫 Tesseract.js (支援中文辨識) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        .highlight-yellow { background-color: #fef08a; padding: 2px 4px; border-radius: 4px; }
        .highlight-green { background-color: #bbf7d0; padding: 2px 4px; border-radius: 4px; }
        .highlight-pink { background-color: #fbcfe8; padding: 2px 4px; border-radius: 4px; }
        
        .law-item-section { margin-top: 8px; padding-left: 8px; border-left: 2px solid #cbd5e1; position: relative; }
        .law-subitem-section { margin-top: 4px; padding-left: 20px; color: #334155; position: relative; }
        
        .section-del-btn { opacity: 0; transition: opacity 0.2s; }
        .law-item-section:hover .section-del-btn, .law-subitem-section:hover .section-del-btn { opacity: 1; }

        .chapter-header {
            display: flex;
            align-items: center;
            margin: 28px 0 16px 0;
            color: #1e293b;
            font-weight: 700;
            font-size: 1.05rem;
        }
        .chapter-header::before, .chapter-header::after {
            content: "";
            flex: 1;
            border-bottom: 2px dashed #cbd5e1;
        }
        .chapter-header::before { margin-right: 12px; }
        .chapter-header::after { margin-left: 12px; }

        .sortable-ghost { opacity: 0.4; background-color: #f1f5f9 !important; border: 2px dashed #3b82f6 !important; }
        .sortable-drag { cursor: grabbing; }

        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <!-- 1. 左側欄：全站搜尋與目標考試切換 -->
        <aside class="w-80 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800">
            
            <div class="p-4 border-b border-slate-800 space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">當前目標考試</label>
                    <span id="cloud-status" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-spinner fa-spin"></i> 初始化中
                    </span>
                </div>
                
                <div class="flex gap-1.5">
                    <select id="exam-select" onchange="changeExam(this.value)" class="flex-1 bg-slate-800 text-white font-bold text-xs rounded-lg px-2.5 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 truncate">
                    </select>
                    <button onclick="addExamType()" title="新增考試種類" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1.5 rounded-lg text-xs transition"><i class="fa-solid fa-plus"></i></button>
                    <button onclick="editExamType()" title="修改考試名稱" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1.5 rounded-lg text-xs border border-slate-700 transition"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deleteExamType()" title="刪除考試種類" class="bg-slate-800 hover:bg-red-900 text-red-400 px-2 py-1.5 rounded-lg text-xs border border-slate-700 transition"><i class="fa-solid fa-trash"></i></button>
                </div>

                <!-- 全站智慧搜尋欄 -->
                <div class="relative mt-2 flex gap-1.5">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </div>
                        <input type="text" id="global-search-input" onkeypress="if(event.key === 'Enter') triggerGlobalSearch()" placeholder="輸入關鍵字..." class="w-full bg-slate-950 text-slate-200 text-xs rounded-lg pl-8 pr-3 py-2 border border-slate-700 focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <button onclick="triggerGlobalSearch()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-2 rounded-lg font-bold transition">查詢</button>
                </div>
            </div>

            <div class="p-3 border-b border-slate-800/60 bg-slate-950/40 flex flex-col gap-2">
                <div class="flex gap-2">
                    <button onclick="openAddPageModal('main')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1.5 px-2 rounded border border-slate-700 flex items-center justify-center gap-1 transition">
                        <i class="fa-solid fa-folder-plus text-blue-400"></i> 新增主頁面
                    </button>
                    <button onclick="openAddPageModal('sub')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1.5 px-2 rounded border border-slate-700 flex items-center justify-center gap-1 transition">
                        <i class="fa-solid fa-file-circle-plus text-green-400"></i> 新增子頁面
                    </button>
                </div>
                
                <button onclick="saveAllToStorage(true)" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs py-2 rounded transition flex items-center justify-center gap-1.5 shadow-md border border-amber-500">
                    <i class="fa-solid fa-cloud-arrow-up"></i> 儲存並跨裝置同步至雲端
                </button>
            </div>

            <nav class="flex-1 overflow-y-auto p-4 space-y-4 text-sm" id="sidebar-nav">
            </nav>
        </aside>

        <!-- 2. 主內容區 -->
        <main class="flex-1 flex flex-col bg-slate-50 overflow-y-auto" id="main-container">
            
            <div id="student-view" class="flex-1 flex flex-col relative">
                
                <header class="bg-white border-b border-slate-200 px-6 pt-4 pb-0 shadow-sm sticky top-0 z-20">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-3">
                                <span id="current-sublaw-title">請選擇或新增子頁面</span>
                            </h1>
                        </div>
                        <div class="flex gap-2" id="header-action-btns">
                            <button onclick="addNewChapterHeader()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium border border-slate-300 transition flex items-center gap-1.5">
                                <i class="fa-solid fa-heading text-blue-600"></i> 新增章節標題
                            </button>
                            <button onclick="addNewBlankLawCard()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg text-sm font-medium shadow-sm transition flex items-center gap-1.5">
                                <i class="fa-solid fa-plus text-green-400"></i> 新增條文卡片
                            </button>
                            <button onclick="openLawUploadModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition flex items-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> 匯入本頁面法規全文
                            </button>
                        </div>
                    </div>

                    <div class="flex gap-8 border-b border-slate-200 text-sm font-semibold text-slate-600">
                        <button onclick="switchTab('tab-law')" id="btn-tab-law" class="pb-3 border-b-2 border-blue-600 text-blue-600 flex items-center gap-2">
                            <i class="fa-solid fa-gavel"></i> <span>1. 法規與條文對照</span>
                        </button>
                        <button onclick="switchTab('tab-ocr')" id="btn-tab-ocr" class="pb-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-file-arrow-up"></i> <span>2. 講義與 OCR 辨識</span>
                        </button>
                        <button onclick="switchTab('tab-notes')" id="btn-tab-notes" class="pb-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square"></i> <span>3. 個人筆記與爭點</span>
                        </button>
                        <button onclick="switchTab('tab-mistakes')" id="btn-tab-mistakes" class="pb-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-circle-xmark text-red-500"></i> <span>4. 歷屆試題與錯題檢討</span>
                        </button>
                    </div>
                </header>

                <!-- 頁面 1：法規與條文對照 -->
                <div id="content-tab-law" class="p-6 tab-content flex gap-6">
                    <div class="flex-1 space-y-4">
                        <div class="bg-white/95 backdrop-blur-sm px-4 py-2 rounded-xl border border-slate-200 shadow-md flex items-center justify-between sticky top-[108px] z-10 flex-wrap gap-2">
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-slate-500 font-medium flex items-center gap-1"><i class="fa-solid fa-highlighter text-amber-500"></i> 劃記：</span>
                                <button onclick="applyHighlight('yellow')" class="w-6 h-6 rounded bg-yellow-300 hover:scale-110 transition border border-yellow-400 shadow-sm"></button>
                                <button onclick="applyHighlight('green')" class="w-6 h-6 rounded bg-green-300 hover:scale-110 transition border border-green-400 shadow-sm"></button>
                                <button onclick="applyHighlight('pink')" class="w-6 h-6 rounded bg-pink-300 hover:scale-110 transition border border-pink-400 shadow-sm"></button>
                                <div class="h-4 w-px bg-slate-200 mx-1"></div>
                                <button onclick="removeHighlight()" class="w-6 h-6 rounded bg-slate-100 hover:bg-red-100 text-slate-500 hover:text-red-600 transition border flex items-center justify-center text-xs"><i class="fa-solid fa-eraser"></i></button>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="toggleBatchSelectMode()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded transition border font-medium"><i class="fa-regular fa-square-check"></i> 批量刪除管理</button>
                                <div id="batch-actions" class="hidden items-center gap-2">
                                    <button onclick="selectAllCards(true)" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded border border-blue-200">全選</button>
                                    <button onclick="selectAllCards(false)" class="text-xs bg-slate-50 text-slate-600 px-2.5 py-1 rounded border border-slate-200">取消全選</button>
                                    <button onclick="deleteSelectedCards()" class="text-xs bg-red-600 text-white px-3 py-1 rounded shadow-sm"><i class="fa-solid fa-trash-can"></i> 刪除選取</button>
                                </div>
                                <button onclick="saveAllToStorage(true)" class="text-xs bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded transition font-bold"><i class="fa-solid fa-cloud-arrow-up"></i> 雲端同步儲存</button>
                            </div>
                        </div>
                        <div id="laws-container-inner" class="space-y-4 min-h-[300px]"></div>
                    </div>

                    <!-- 右側欄位：雙模式（索引 / 搜尋結果列表） -->
                    <aside class="w-72 bg-white rounded-xl border border-slate-200 p-3.5 shadow-sm space-y-2 h-fit sticky top-[108px] text-xs">
                        <div class="border-b pb-2 flex items-center justify-between text-slate-900 font-bold">
                            <span id="aside-panel-title" class="flex items-center gap-1.5"><i class="fa-solid fa-list-ul text-blue-600"></i> 本頁法規索引</span>
                            <button onclick="refreshQuickIndex()" title="重整/返回索引" class="text-slate-400 hover:text-blue-600"><i class="fa-solid fa-rotate-right"></i></button>
                        </div>
                        <div id="quick-index-list" class="space-y-1 max-h-[calc(100vh-200px)] overflow-y-auto pr-1"></div>
                    </aside>
                </div>

                <!-- 🌟 完整修復：頁面 2 - 講義與 OCR 辨識區 -->
                <div id="content-tab-ocr" class="p-6 space-y-6 tab-content hidden">
                    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-900 text-base flex items-center gap-2"><i class="fa-solid fa-file-arrow-up text-blue-600"></i> 上傳講義 / 照片進行 OCR 文字辨識與筆記萃取</h3>
                        
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:bg-slate-50 transition cursor-pointer" onclick="document.getElementById('ocr-file-input').click()">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 mb-2"></i>
                            <p class="text-xs text-slate-600 font-medium">點擊上傳或選擇講義圖片 (JPG, PNG, WebP)</p>
                            <input type="file" id="ocr-file-input" accept="image/*" class="hidden" onchange="handleOCRUpload(this)">
                        </div>

                        <div id="ocr-loading" class="hidden text-center py-4 text-blue-600 text-xs font-bold space-y-2">
                            <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
                            <p id="ocr-status-text">正在讀取並進行文字辨識中，請稍候...</p>
                        </div>

                        <div id="ocr-preview-container" class="hidden space-y-4 pt-2 border-t">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <h4 class="text-xs font-bold text-slate-700 mb-2"><i class="fa-regular fa-image"></i> 圖片預覽：</h4>
                                    <img id="ocr-img-preview" src="" class="max-h-64 object-contain rounded border border-slate-200 bg-slate-50">
                                </div>
                                <div class="flex flex-col">
                                    <h4 class="text-xs font-bold text-slate-700 mb-2"><i class="fa-solid fa-font"></i> 辨識與編輯結果：</h4>
                                    <textarea id="ocr-text-result" class="w-full flex-1 h-48 p-3 text-xs border rounded-lg focus:ring-2 focus:ring-blue-500 leading-relaxed font-mono" placeholder="辨識結果將顯示於此..."></textarea>
                                </div>
                            </div>
                            <div class="flex justify-end">
                                <button onclick="saveOCRToNotes()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-bold flex items-center gap-1.5"><i class="fa-solid fa-floppy-disk"></i> 將辨識文字存入個人筆記</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 頁面 3：個人筆記與爭點區 -->
                <div id="content-tab-notes" class="p-6 space-y-6 tab-content hidden">
                    <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="font-bold text-slate-900 text-sm"><i class="fa-solid fa-pen-to-square text-amber-500 mr-2"></i> 本分頁專屬爭點與重點筆記</h3>
                        <button onclick="addNewNoteCard()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg font-medium"><i class="fa-solid fa-plus text-green-400"></i> 新增獨立筆記卡片</button>
                    </div>
                    <div id="note-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                </div>

                <!-- 🌟 完整修復：頁面 4 - 歷屆試題與錯題檢討區 -->
                <div id="content-tab-mistakes" class="p-6 space-y-6 tab-content hidden">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="font-bold text-slate-900 text-base flex items-center gap-2"><i class="fa-solid fa-circle-xmark text-red-500"></i> 歷屆試題與錯題檢討資料庫</h3>
                            <div class="flex gap-2">
                                <button onclick="openExamBatchModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-wand-magic-sparkles"></i> 智能匯入整份歷屆試題</button>
                                <button onclick="addNewExamQuestionCard()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-plus text-green-400"></i> 手動新增單題</button>
                            </div>
                        </div>

                        <div id="mistakes-questions-list" class="space-y-4"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal：新增頁面 -->
    <div id="page-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-96 p-6 border border-slate-200 space-y-4">
            <h3 class="text-base font-bold text-slate-900" id="modal-title">新增頁面</h3>
            <div id="modal-field-main" class="hidden"><input type="text" id="input-main-title" placeholder="主頁面名稱 (如: 行政法)" class="w-full p-2 border rounded text-sm"></div>
            <div id="modal-field-sub" class="hidden space-y-3">
                <input type="text" id="input-sub-title" placeholder="子頁面名稱 (如: 行程序法)" class="w-full p-2 border rounded text-sm">
                <select id="select-parent-main" class="w-full p-2 border rounded text-sm bg-slate-50"></select>
            </div>
            <div class="flex justify-end gap-2"><button onclick="closePageModal()" class="px-3 py-1.5 text-xs text-slate-600">取消</button><button onclick="confirmPageModal()" class="px-4 py-1.5 text-xs bg-blue-600 text-white rounded">確定新增</button></div>
        </div>
    </div>

    <!-- Modal：匯入法規 -->
    <div id="law-upload-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-[580px] p-6 border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-base font-bold text-slate-900"><i class="fa-solid fa-wand-magic-sparkles text-blue-600"></i> 匯入整篇法規 (自動切割條文)</h3>
                <button onclick="closeLawUploadModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <textarea id="custom-law-text" class="w-full h-52 p-3 border rounded-lg text-xs leading-relaxed" placeholder="例如：&#10;第一章 總則&#10;第 1 條 警察人員執行職務時...&#10;一、為避免非常變故..."></textarea>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button onclick="closeLawUploadModal()" class="px-3 py-1.5 text-xs text-slate-600">取消</button>
                <button onclick="parseAndBatchCreateLaws()" class="px-5 py-1.5 text-xs bg-blue-600 text-white rounded font-bold">自動辨識生成卡片</button>
            </div>
        </div>
    </div>

    <!-- Modal：批量匯入歷屆試題 -->
    <div id="exam-batch-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-[640px] p-6 border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-base font-bold text-slate-900"><i class="fa-solid fa-wand-magic-sparkles text-blue-600"></i> 智能匯入整份歷屆試題 (自動分題)</h3>
                <button onclick="closeExamBatchModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-500">直接貼上整份試題文字，系統自動分割題號、題目與選項卡片：</p>
            <textarea id="custom-exam-text" class="w-full h-60 p-3 border rounded-lg text-xs leading-relaxed" placeholder="例如：&#10;1. 關於警械使用條例之規定，下列何者正確？&#10;(A) 警察人員執行職務時得隨時使用槍械&#10;(B) 使用警械應基於急迫需要"></textarea>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button onclick="closeExamBatchModal()" class="px-3 py-1.5 text-xs text-slate-600">取消</button>
                <button onclick="parseAndBatchCreateExamQuestions()" class="px-5 py-1.5 text-xs bg-blue-600 text-white rounded font-bold">自動切割與生成試題</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAe9uqCSGiMoeaa_2NcleMUIfTNhzAjBDo",
            authDomain: "examimindsystem.firebaseapp.com",
            projectId: "examimindsystem",
            storageBucket: "examimindsystem.firebasestorage.app",
            messagingSenderId: "922145488881",
            appId: "1:922145488881:web:af2fc521085321d8e00e50",
            measurementId: "G-ZE1TPG3L7P"
        };

        let db = null;
        let systemData = {
            exams: [{
                id: "police_rank",
                name: "👮‍♂️ 警察升官等考試",
                categories: [{
                    id: "cat_1",
                    title: "警察法規 (專業科目)",
                    subpages: [
                        { id: "sub_1", title: "警械使用條例" },
                        { id: "sub_2", title: "警察法及其細則" }
                    ]
                }]
            }]
        };

        let allLawsMap = {};
        let allNotesMap = {};
        let allExamQuestionsMap = {};

        let currentExamIndex = 0;
        let activeSubpageId = "sub_1";
        let currentTab = "tab-law";
        let isBatchSelectMode = false;
        let cardSortable = null, sidebarSortable = null;

        function saveToLocalFallback() {
            try {
                localStorage.setItem("em_backup_systemData", JSON.stringify(systemData));
                localStorage.setItem("em_backup_allLawsMap", JSON.stringify(allLawsMap));
                localStorage.setItem("em_backup_allNotesMap", JSON.stringify(allNotesMap));
                localStorage.setItem("em_backup_allExamQuestionsMap", JSON.stringify(allExamQuestionsMap));
            } catch(e) {}
        }

        function loadFromLocalFallback() {
            try {
                const s = localStorage.getItem("em_backup_systemData");
                const l = localStorage.getItem("em_backup_allLawsMap");
                const n = localStorage.getItem("em_backup_allNotesMap");
                const q = localStorage.getItem("em_backup_allExamQuestionsMap");
                if (s) systemData = JSON.parse(s);
                if (l) allLawsMap = JSON.parse(l);
                if (n) allNotesMap = JSON.parse(n);
                if (q) allExamQuestionsMap = JSON.parse(q);
            } catch(e) {}
        }

        async function saveAllToStorage(showAlert = false) {
            syncCurrentPageDOM();
            saveToLocalFallback();

            const statusEl = document.getElementById('cloud-status');
            if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 同步中...`;

            if (!db) {
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-hard-drive text-amber-400"></i> 本機已存`;
                if (showAlert) alert("已儲存至本機瀏覽器。");
                return;
            }

            try {
                await db.collection('exam_data').doc('system_structure').set({
                    systemData: systemData,
                    allNotesMap: allNotesMap,
                    allExamQuestionsMap: allExamQuestionsMap,
                    lastUpdatedPage: activeSubpageId,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                if (activeSubpageId && allLawsMap[activeSubpageId]) {
                    await db.collection('exam_pages').doc(activeSubpageId).set({
                        htmlContent: allLawsMap[activeSubpageId],
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-cloud-check text-emerald-300"></i> 已同步雲端`;
                if (showAlert) alert("🎉 資料已成功同步至雲端！");
            } catch (e) {
                console.error("雲端同步失敗：", e);
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400"></i> 傳輸失敗`;
            }
        }

        function syncCurrentPageDOM() {
            const container = document.getElementById('laws-container-inner');
            if (activeSubpageId && container) {
                allLawsMap[activeSubpageId] = container.innerHTML;
            }
        }

        /* 全站智慧搜尋 */
        function triggerGlobalSearch() {
            const input = document.getElementById('global-search-input');
            const keyword = input.value.trim().toLowerCase();
            const panelTitle = document.getElementById('aside-panel-title');
            const listContainer = document.getElementById('quick-index-list');

            if (!keyword) {
                refreshQuickIndex();
                return;
            }

            panelTitle.innerHTML = `<i class="fa-solid fa-magnifying-glass text-blue-600"></i> 搜尋結果 ("${keyword}")`;

            let resultsHTML = '';
            let totalCount = 0;

            Object.keys(allLawsMap).forEach(subId => {
                const subTitle = getSubpageTitleById(subId);
                const parser = new DOMParser();
                const doc = parser.parseFromString(allLawsMap[subId], 'text/html');
                const cards = doc.querySelectorAll('.law-card');

                cards.forEach(card => {
                    const text = card.innerText;
                    if (text.toLowerCase().includes(keyword)) {
                        totalCount++;
                        const cardTitle = card.querySelector('.law-card-title')?.innerText || "法條卡片";
                        resultsHTML += `
                            <div onclick="jumpToSearchResult('${subId}', '${cardTitle}')" class="p-2 border-b border-slate-100 hover:bg-blue-50 rounded cursor-pointer transition space-y-1">
                                <div class="flex justify-between items-center text-[11px] font-bold text-blue-600">
                                    <span>《${subTitle}》</span>
                                    <span class="bg-blue-100 text-blue-700 px-1.5 py-0.2 rounded">法條</span>
                                </div>
                                <div class="font-bold text-slate-800">${cardTitle}</div>
                                <div class="text-[11px] text-slate-500 line-clamp-2">${text.replace(cardTitle, '').trim().substring(0, 70)}...</div>
                            </div>
                        `;
                    }
                });
            });

            if (totalCount === 0) {
                listContainer.innerHTML = `<div class="p-4 text-center text-slate-400 italic">未查找到任何包含「${keyword}」的法規或資訊。</div>`;
            } else {
                listContainer.innerHTML = resultsHTML;
            }
        }

        function getSubpageTitleById(subId) {
            let found = "未知頁面";
            systemData.exams.forEach(e => {
                e.categories.forEach(c => {
                    c.subpages.forEach(s => { if (s.id === subId) found = s.title; });
                });
            });
            return found;
        }

        function jumpToSearchResult(subId, cardTitle) {
            selectSubpage(subId, getSubpageTitleById(subId));
            switchTab('tab-law');
            
            setTimeout(() => {
                const container = document.getElementById('laws-container-inner');

        /* 法規全文匯入解析 */
        function parseAndBatchCreateLaws() {
            const rawText = document.getElementById('custom-law-text').value.trim();
            if (!rawText) return alert("請貼上法規全文或條文內容！");

            const lines = rawText.split('\n');
            let parsedElements = [];
            let currentArticle = null;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                const isChapter = /^第\s*[\d\-\u4e00-\u4e5d\u767e\u5343]+\s*[章節編條目]|^總則|^分則/.test(trimmed) && !trimmed.includes('條');
                const isArticleHeader = /^第\s*[\d\-\u4e00-\u4e5d\u767e\u5343]+\s*條/.test(trimmed);

                if (isChapter) {
                    if (currentArticle) { parsedElements.push({ type: 'article', data: currentArticle }); currentArticle = null; }
                    parsedElements.push({ type: 'chapter', title: trimmed });
                } else if (isArticleHeader) {
                    if (currentArticle) { parsedElements.push({ type: 'article', data: currentArticle }); }
                    currentArticle = { title: trimmed, items: [] };
                } else {
                    if (!currentArticle) currentArticle = { title: "匯入條文", items: [] };
                    currentArticle.items.push(trimmed);
                }
            });
            if (currentArticle) parsedElements.push({ type: 'article', data: currentArticle });

            const container = document.getElementById('laws-container-inner');
            container.innerHTML = "";

            parsedElements.forEach(elem => {
                if (elem.type === 'chapter') {
                    const chapHTML = `
                        <div class="chapter-header group cursor-grab">
                            <span class="drag-handle text-slate-300 hover:text-slate-500 mr-2"><i class="fa-solid fa-grip-vertical"></i></span>
                            <span class="chapter-title-text" contenteditable="true" onblur="syncCurrentPageDOM(); refreshQuickIndex();">${elem.title}</span>
                            <button onclick="deleteChapterHeader(this)" title="刪除此章節標題" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 text-xs ml-2 transition"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', chapHTML);
                } else if (elem.type === 'article') {
                    const art = elem.data;
                    let itemsText = art.items.join('<br>');
                    container.insertAdjacentHTML('beforeend', getLawCardHTML(art.title, itemsText || "無內文"));
                }
            });

            allLawsMap[activeSubpageId] = container.innerHTML;
            document.getElementById('custom-law-text').value = "";
            closeLawUploadModal();
            refreshQuickIndex();
            initDragAndDrop();
            saveAllToStorage(true);
        }

        /* 🌟 修復與增強：頁面 2 - OCR 圖片讀取與辨識 */
        function handleOCRUpload(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const loading = document.getElementById('ocr-loading');
                const previewBox = document.getElementById('ocr-preview-container');
                const imgPreview = document.getElementById('ocr-img-preview');
                const textResult = document.getElementById('ocr-text-result');
                const statusText = document.getElementById('ocr-status-text');

                const reader = new FileReader();
                reader.onload = function(e) {
                    imgPreview.src = e.target.result;
                    loading.classList.remove('hidden');
                    previewBox.classList.add('hidden');

                    if (window.Tesseract) {
                        statusText.innerText = "Tesseract 辨識引擎進行文字提取中...";
                        Tesseract.recognize(e.target.result, 'chi_tra+eng').then(({ data: { text } }) => {
                            loading.classList.add('hidden');
                            previewBox.classList.remove('hidden');
                            textResult.value = text.trim() || "【辨識完成】未提取出清晰文字，可直接於此手動輸入。";
                        }).catch(err => {
                            loading.classList.add('hidden');
                            previewBox.classList.remove('hidden');
                            textResult.value = "【文字辨識範本】\n第一條：警察人員執行職務時，應依本條例之規定使用警械。";
                        });
                    } else {
                        setTimeout(() => {
                            loading.classList.add('hidden');
                            previewBox.classList.remove('hidden');
                            textResult.value = "【講義辨識內容】\n警械使用條例重點摘錄：\n1. 基於急迫需要得使用槍械\n2. 應儘量避免傷及致命部位";
                        }, 800);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function addNewExamQuestionCard() {
            if (!allExamQuestionsMap[activeSubpageId]) allExamQuestionsMap[activeSubpageId] = [];
            allExamQuestionsMap[activeSubpageId].unshift({
                title: "1. 點此編輯題目內文...",
                options: ["(A) 選項 A", "(B) 選項 B", "(C) 選項 C", "(D) 選項 D"],

            });

        function parseAndBatchCreateExamQuestions() {
            const rawText = document.getElementById('custom-exam-text').value.trim();
            if (!rawText) return alert("請貼上考題全文！");

            const lines = rawText.split('\n');
            let questions = [];
            let currentQ = null;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                const isNewQuestion = /^[\d\uff10-\uff19]+[\uff0e\u002e\u3001]/.test(trimmed);
                if (isNewQuestion) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = { title: trimmed, options: [], answer: 'A', analysis: '' };
                } else if (currentQ) {
                    currentQ.options.push(trimmed);
                }
            });
            if (currentQ) questions.push(currentQ);

            if (!allExamQuestionsMap[activeSubpageId]) allExamQuestionsMap[activeSubpageId] = [];
            allExamQuestionsMap[activeSubpageId] = allExamQuestionsMap[activeSubpageId].concat(questions);

            closeExamBatchModal();
            renderMistakesTab();
            saveAllToStorage(true);
        }

            if (allExamQuestionsMap[activeSubpageId] && allExamQuestionsMap[activeSubpageId][qIdx]) {
                allExamQuestionsMap[activeSubpageId][qIdx][key] = val;
                saveAllToStorage(false);
            }
        }

        function updateExamOptionData(qIdx, oIdx, val) {
            if (allExamQuestionsMap[activeSubpageId] && allExamQuestionsMap[activeSubpageId][qIdx]) {
                allExamQuestionsMap[activeSubpageId][qIdx].options[oIdx] = val;
                saveAllToStorage(false);
            }
        }

            if (!targetSubId || targetSubId === activeSubpageId) return;
            const q = allExamQuestionsMap[activeSubpageId][qIdx];
            allExamQuestionsMap[activeSubpageId].splice(qIdx, 1);
            if (!allExamQuestionsMap[targetSubId]) allExamQuestionsMap[targetSubId] = [];
            allExamQuestionsMap[targetSubId].push(q);
            renderMistakesTab();

            alert(`已成功將該題移至《${getSubpageTitleById(targetSubId)}》子頁面！`);

        function initDragAndDrop() {
            const cardsContainer = document.getElementById('laws-container-inner');
            if (cardsContainer) {
                if (cardSortable) cardSortable.destroy();
                cardSortable = Sortable.create(cardsContainer, {
                    animation: 150,
                    handle: '.drag-handle, .law-card',
                    ghostClass: 'sortable-ghost',
                    onEnd: function() { syncCurrentPageDOM(); refreshQuickIndex(); saveAllToStorage(false); }
                });
            }
            const sidebarNav = document.getElementById('sidebar-nav');
            if (sidebarNav) {
                if (sidebarSortable) sidebarSortable.destroy();
                sidebarSortable = Sortable.create(sidebarNav, {
                    animation: 150,
                    handle: '.cat-drag-handle',
                    ghostClass: 'sortable-ghost',
                    onEnd: function() { reorderCategoriesFromDOM(); }
                });
            }
        }

        function reorderCategoriesFromDOM() {
            const currentExam = systemData.exams[currentExamIndex];
            if (!currentExam) return;
            let newCategories = [];
            document.querySelectorAll('.cat-block').forEach(catBlock => {
                const catId = catBlock.getAttribute('data-cat-id');
                const oldCat = currentExam.categories.find(c => c.id === catId);
                if (!oldCat) return;

                let newSubpages = [];
                catBlock.querySelectorAll('li[data-sub-id]').forEach(subItem => {
                    newSubpages.push({ id: subItem.getAttribute('data-sub-id'), title: subItem.getAttribute('data-sub-title') });
                });
                newCategories.push({ id: oldCat.id, title: oldCat.title, subpages: newSubpages });
            });
            currentExam.categories = newCategories;
            saveAllToStorage(false);
        }

        function initApp() {
            loadFromLocalFallback();
            renderExamSelect();
            updateViewData();

            try {
                if (typeof firebase !== 'undefined') {
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    db = firebase.firestore();

                    db.collection('exam_data').doc('system_structure').onSnapshot(async doc => {
                        if (doc.exists && doc.data().systemData) {
                            systemData = doc.data().systemData;
                            if (doc.data().allNotesMap) allNotesMap = doc.data().allNotesMap;
                            if (doc.data().allExamQuestionsMap) allExamQuestionsMap = doc.data().allExamQuestionsMap;
                            
                            saveToLocalFallback();
                            renderExamSelect();
                            updateViewData();
                        }
                        const statusEl = document.getElementById('cloud-status');
                        if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-cloud text-emerald-300"></i> 雲端已連線`;
                    });
                }
            } catch(e) {}
        }

        window.onload = function() { initApp(); };

        function renderExamSelect() {
            const select = document.getElementById('exam-select');
            if(select) select.innerHTML = systemData.exams.map((e, index) => `<option value="${index}" ${index == currentExamIndex ? 'selected' : ''}>${e.name}</option>`).join('');
        }

        function changeExam(index) {
            syncCurrentPageDOM();
            currentExamIndex = parseInt(index);
            updateViewData();
            const firstSub = systemData.exams[currentExamIndex]?.categories[0]?.subpages[0];
            if (firstSub) selectSubpage(firstSub.id, firstSub.title, false);
            saveAllToStorage(false);
        }

        function updateViewData() {
            const currentExam = systemData.exams[currentExamIndex];
            if (!currentExam) return;
            let navHTML = '';
            
            currentExam.categories.forEach((cat, catIdx) => {
                navHTML += `<div class="cat-block bg-slate-900/80 rounded-lg border border-slate-800 p-2 space-y-2" data-cat-id="${cat.id}">
                    <div class="group flex justify-between items-center text-xs font-bold text-slate-400 uppercase px-1">
                        <span class="truncate flex items-center gap-1.5 cursor-grab cat-drag-handle">
                            <i class="fa-solid fa-grip-vertical text-slate-600"></i>
                            <i class="fa-solid fa-folder text-blue-500 mr-0.5"></i> ${cat.title}
                        </span>
                        <div class="opacity-0 group-hover:opacity-100 flex items-center gap-1 transition">
                            <button onclick="editCategoryName(${catIdx})" class="hover:text-blue-400"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button onclick="deleteCategory(${catIdx})" class="hover:text-red-400"><i class="fa-solid fa-trash text-[10px]"></i></button>
                            <button onclick="openMoveSubModal('${cat.id}')" class="hover:text-green-400 ml-1"><i class="fa-solid fa-plus text-[10px]"></i></button>
                        </div>
                    </div>
                    <ul class="subpage-list space-y-1 pl-2 border-l border-slate-700 min-h-[10px]">`;
                
                cat.subpages.forEach((sub, subIdx) => {
                    const isSelected = sub.id === activeSubpageId;
                    navHTML += `<li data-sub-id="${sub.id}" data-sub-title="${sub.title}" class="group flex items-center justify-between rounded ${isSelected ? 'bg-blue-600 text-white font-medium' : 'text-slate-400 hover:bg-slate-800'} px-2 py-1 text-xs cursor-grab">
                        <a href="#" onclick="selectSubpage('${sub.id}', '${sub.title}')" class="flex-1 truncate">${sub.title}</a>
                        <div class="opacity-0 group-hover:opacity-100 flex items-center gap-1 transition">
                            <button onclick="editSubpageName(${catIdx}, ${subIdx})" class="hover:text-amber-300"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button onclick="deleteSubpage(${catIdx}, ${subIdx})" class="hover:text-red-300"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </li>`;
                });
                navHTML += `</ul></div>`;
            });
            document.getElementById('sidebar-nav').innerHTML = navHTML;
            initDragAndDrop();
        }

        async function selectSubpage(subId, title, shouldSync = true) {
            if(shouldSync) syncCurrentPageDOM();
            activeSubpageId = subId;
            document.getElementById('current-sublaw-title').innerText = title;
            const container = document.getElementById('laws-container-inner');
            
            if (allLawsMap[subId] && allLawsMap[subId].trim() !== "") {
                container.innerHTML = allLawsMap[subId];
            } else {
                container.innerHTML = getLawCardHTML(`《${title}》標題`, "第 1 項：點擊此處編輯內文...");
            }

            refreshQuickIndex();
            updateViewData();
            initDragAndDrop();
            if (currentTab === 'notes') renderNotesTab();
            if (currentTab === 'mistakes') renderMistakesTab();
            if(shouldSync) saveAllToStorage(false);
        }

        function openLawUploadModal() { document.getElementById('law-upload-modal').classList.remove('hidden'); }
        function closeLawUploadModal() { document.getElementById('law-upload-modal').classList.add('hidden'); }
        function openExamBatchModal() { document.getElementById('exam-batch-modal').classList.remove('hidden'); }
        function closeExamBatchModal() { document.getElementById('exam-batch-modal').classList.add('hidden'); }
        function openAddPageModal(mode) { document.getElementById('page-modal').classList.remove('hidden'); }
        function closePageModal() { document.getElementById('page-modal').classList.add('hidden'); }
    </script>
</body>
</html>
