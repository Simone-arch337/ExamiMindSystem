<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國家考試智慧備考系統 ExamiMind (全分頁雲端同步與 PDF 亂碼修正版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- PDF.js 解析庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <style>
        .highlight-yellow { background-color: #fef08a; padding: 2px 4px; border-radius: 4px; }
        .highlight-green { background-color: #bbf7d0; padding: 2px 4px; border-radius: 4px; }
        .highlight-pink { background-color: #fbcfe8; padding: 2px 4px; border-radius: 4px; }
        
        .law-item-section { margin-top: 8px; padding-left: 8px; border-left: 2px solid #cbd5e1; position: relative; }
        .law-subitem-section { margin-top: 4px; padding-left: 20px; color: #334155; position: relative; }
        
        /* 唯讀防誤觸模式：隱藏刪除與輔助新增按鈕 */
        .is-readonly .section-del-btn,
        .is-readonly .card-edit-controls,
        .is-readonly .drag-handle,
        .is-readonly .card-select-checkbox { display: none !important; }

        .chapter-header {
            display: flex;
            align-items: center;
            margin: 28px 0 16px 0;
            color: #1e293b;
            font-weight: 700;
            font-size: 1.05rem;
        }
        .chapter-header::before, .chapter-header::after {
            content: "";
            flex: 1;
            border-bottom: 2px dashed #cbd5e1;
        }
        .chapter-header::before { margin-right: 12px; }
        .chapter-header::after { margin-left: 12px; }

        .sortable-ghost { opacity: 0.4; background-color: #f1f5f9 !important; border: 2px dashed #3b82f6 !important; }
        .sortable-drag { cursor: grabbing; }

        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <!-- 1. 左側欄：全站搜尋與目標考試切換 -->
        <aside class="w-80 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800">
            
            <div class="p-4 border-b border-slate-800 space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">當前目標考試</label>
                    <span id="cloud-status" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-spinner fa-spin"></i> 初始化中
                    </span>
                </div>
                
                <div class="flex gap-1.5">
                    <select id="exam-select" onchange="changeExam(this.value)" class="flex-1 bg-slate-800 text-white font-bold text-xs rounded-lg px-2.5 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 truncate">
                    </select>
                    <button onclick="addExamType()" title="新增考試種類" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1.5 rounded-lg text-xs transition"><i class="fa-solid fa-plus"></i></button>
                    <button onclick="editExamType()" title="修改考試名稱" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1.5 rounded-lg text-xs border border-slate-700 transition"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deleteExamType()" title="刪除考試種類" class="bg-slate-800 hover:bg-red-900 text-red-400 px-2 py-1.5 rounded-lg text-xs border border-slate-700 transition"><i class="fa-solid fa-trash"></i></button>
                </div>

                <!-- 智慧搜尋欄 -->
                <div class="relative mt-2 flex gap-1.5">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </div>
                        <input type="text" id="global-search-input" onkeypress="if(event.key === 'Enter') triggerGlobalSearch()" placeholder="輸入關鍵字..." class="w-full bg-slate-950 text-slate-200 text-xs rounded-lg pl-8 pr-3 py-2 border border-slate-700 focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <button onclick="triggerGlobalSearch()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-2 rounded-lg font-bold transition">查詢</button>
                </div>
            </div>

            <div class="p-3 border-b border-slate-800/60 bg-slate-950/40 flex flex-col gap-2">
                <div class="flex gap-2">
                    <button onclick="openAddPageModal('main')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1.5 px-2 rounded border border-slate-700 flex items-center justify-center gap-1 transition">
                        <i class="fa-solid fa-folder-plus text-blue-400"></i> 新增主頁面
                    </button>
                    <button onclick="openAddPageModal('sub')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1.5 px-2 rounded border border-slate-700 flex items-center justify-center gap-1 transition">
                        <i class="fa-solid fa-file-circle-plus text-green-400"></i> 新增子頁面
                    </button>
                </div>
                
                <button onclick="saveAllToStorage(true)" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs py-2 rounded transition flex items-center justify-center gap-1.5 shadow-md border border-amber-500">
                    <i class="fa-solid fa-cloud-arrow-up"></i> 儲存並跨裝置同步至雲端
                </button>
            </div>

            <nav class="flex-1 overflow-y-auto p-4 space-y-4 text-sm" id="sidebar-nav">
            </nav>
        </aside>

        <!-- 2. 主內容區 -->
        <main class="flex-1 flex flex-col bg-slate-50 overflow-y-auto" id="main-container">
            
            <div id="student-view" class="flex-1 flex flex-col relative">
                
                <header class="bg-white border-b border-slate-200 px-6 pt-4 pb-0 shadow-sm sticky top-0 z-20">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-3">
                                <span id="current-sublaw-title">警械使用條例</span>
                            </h1>
                        </div>
                        <div class="flex gap-2" id="header-action-btns">
                            <button onclick="addNewChapterHeader()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium border border-slate-300 transition flex items-center gap-1.5">
                                <i class="fa-solid fa-heading text-blue-600"></i> 新增章節標題
                            </button>
                            <button onclick="addNewBlankLawCard()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg text-sm font-medium shadow-sm transition flex items-center gap-1.5">
                                <i class="fa-solid fa-plus text-green-400"></i> 新增條文卡片
                            </button>
                            <button onclick="openLawUploadModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition flex items-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> 匯入本頁面法規全文
                            </button>
                        </div>
                    </div>

                    <div class="flex gap-8 border-b border-slate-200 text-sm font-semibold text-slate-600">
                        <button onclick="switchTab('tab-law')" id="btn-tab-law" class="pb-3 border-b-2 border-blue-600 text-blue-600 flex items-center gap-2">
                            <i class="fa-solid fa-gavel"></i> <span>1. 法規與條文對照</span>
                        </button>
                        <button onclick="switchTab('tab-ocr')" id="btn-tab-ocr" class="pb-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-file-arrow-up"></i> <span>2. 講義與 OCR 辨識</span>
                        </button>
                        <button onclick="switchTab('tab-notes')" id="btn-tab-notes" class="pb-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square"></i> <span>3. 個人筆記與爭點</span>
                        </button>
                        <button onclick="switchTab('tab-mistakes')" id="btn-tab-mistakes" class="pb-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-circle-xmark text-red-500"></i> <span>4. 歷屆試題與錯題檢討</span>
                        </button>
                    </div>
                </header>

                <!-- 頁面 1：法規與條文對照 -->
                <div id="content-tab-law" class="p-6 tab-content flex gap-6">
                    <div class="flex-1 space-y-4">
                        <div class="bg-white/95 backdrop-blur-sm px-4 py-2 rounded-xl border border-slate-200 shadow-md flex items-center justify-between sticky top-[108px] z-10 flex-wrap gap-2">
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-slate-500 font-medium flex items-center gap-1"><i class="fa-solid fa-highlighter text-amber-500"></i> 劃記：</span>
                                <button onclick="applyHighlight('yellow')" class="w-6 h-6 rounded bg-yellow-300 hover:scale-110 transition border border-yellow-400 shadow-sm" title="黃色螢光筆"></button>
                                <button onclick="applyHighlight('green')" class="w-6 h-6 rounded bg-green-300 hover:scale-110 transition border border-green-400 shadow-sm" title="綠色螢光筆"></button>
                                <button onclick="applyHighlight('pink')" class="w-6 h-6 rounded bg-pink-300 hover:scale-110 transition border border-pink-400 shadow-sm" title="粉色螢光筆"></button>
                                <div class="h-4 w-px bg-slate-200 mx-1"></div>
                                <button onclick="removeHighlight()" class="w-6 h-6 rounded bg-slate-100 hover:bg-red-100 text-slate-500 hover:text-red-600 transition border flex items-center justify-center text-xs" title="橡皮擦"><i class="fa-solid fa-eraser"></i></button>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="toggleBatchSelectMode()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded transition border font-medium"><i class="fa-regular fa-square-check"></i> 批量刪除管理</button>
                                <div id="batch-actions" class="hidden items-center gap-2">
                                    <button onclick="selectAllCards(true)" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded border border-blue-200">全選</button>
                                    <button onclick="selectAllCards(false)" class="text-xs bg-slate-50 text-slate-600 px-2.5 py-1 rounded border border-slate-200">取消全選</button>
                                    <button onclick="deleteSelectedCards()" class="text-xs bg-red-600 text-white px-3 py-1 rounded shadow-sm"><i class="fa-solid fa-trash-can"></i> 刪除選取</button>
                                </div>
                                <button onclick="saveAllToStorage(true)" class="text-xs bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded transition font-bold"><i class="fa-solid fa-cloud-arrow-up"></i> 雲端同步儲存</button>
                            </div>
                        </div>
                        <div id="laws-container-inner" class="space-y-4 min-h-[300px]"></div>
                    </div>

                    <!-- 右側欄位：索引 / 搜尋結果列表 -->
                    <aside class="w-72 bg-white rounded-xl border border-slate-200 p-3.5 shadow-sm space-y-2 h-fit sticky top-[108px] text-xs">
                        <div class="border-b pb-2 flex items-center justify-between text-slate-900 font-bold">
                            <span id="aside-panel-title" class="flex items-center gap-1.5"><i class="fa-solid fa-list-ul text-blue-600"></i> 本頁法規索引</span>
                            <button onclick="refreshQuickIndex()" title="重整/返回索引" class="text-slate-400 hover:text-blue-600"><i class="fa-solid fa-rotate-right"></i></button>
                        </div>
                        <div id="quick-index-list" class="space-y-1 max-h-[calc(100vh-200px)] overflow-y-auto pr-1"></div>
                    </aside>
                </div>

                <!-- 頁面 2：講義與 OCR 辨識區 (已加入同步儲存) -->
                <div id="content-tab-ocr" class="p-6 space-y-6 tab-content hidden">
                    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-900 text-base flex items-center gap-2"><i class="fa-solid fa-file-arrow-up text-blue-600"></i> 上傳講義 / 照片進行 OCR 文字辨識與筆記萃取</h3>
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:bg-slate-50 transition cursor-pointer" onclick="document.getElementById('ocr-file-input').click()">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 mb-2"></i>
                            <p class="text-xs text-slate-600 font-medium">點擊上傳或拖曳講義照片/PDF 文件至此處</p>
                            <input type="file" id="ocr-file-input" class="hidden" onchange="handleOCRUpload(this)">
                        </div>
                        <div id="ocr-preview-container" class="space-y-3 pt-2">
                            <h4 class="text-xs font-bold text-slate-700">辨識與編輯區（自動同步儲存）：</h4>
                            <textarea id="ocr-text-result" onchange="saveOCRResultText(this.value)" class="w-full h-48 p-3 text-xs border rounded-lg focus:ring-2 focus:ring-blue-500 leading-relaxed" placeholder="辨識結果將顯示於此..."></textarea>
                            <button onclick="saveOCRToNotes()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-bold shadow-sm transition"><i class="fa-solid fa-floppy-disk"></i> 將辨識文字轉存入「個人筆記與爭點」</button>
                        </div>
                    </div>
                </div>

                <!-- 頁面 3：個人筆記與爭點區 -->
                <div id="content-tab-notes" class="p-6 space-y-6 tab-content hidden">
                    <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="font-bold text-slate-900 text-sm"><i class="fa-solid fa-pen-to-square text-amber-500 mr-2"></i> 本分頁專屬爭點與重點筆記</h3>
                        <button onclick="addNewNoteCard()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg font-medium"><i class="fa-solid fa-plus text-green-400"></i> 新增獨立筆記卡片</button>
                    </div>
                    <div id="note-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                </div>

                <!-- 頁面 4：歷屆試題與錯題檢討區 -->
                <div id="content-tab-mistakes" class="p-6 space-y-6 tab-content hidden">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <div class="flex justify-between items-center border-b pb-3 flex-wrap gap-2">
                            <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
                                <i class="fa-solid fa-circle-xmark text-red-500"></i> 歷屆試題與線上測驗刷題庫
                            </h3>
                            <div class="flex gap-2">
                                <label class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1.5 shadow-sm cursor-pointer transition">
                                    <i class="fa-solid fa-file-pdf"></i> 上傳考選部 PDF 試題
                                    <input type="file" id="pdf-exam-file-input" accept="application/pdf" class="hidden" onchange="handlePDFExamUpload(this)">
                                </label>
                                <button onclick="openExamBatchModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-wand-magic-sparkles"></i> 貼上文字批量匯入</button>
                                <button onclick="addNewExamQuestionCard()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-plus text-green-400"></i> 手動新增單題</button>
                            </div>
                        </div>

                        <!-- 答題進度條與重測 -->
                        <div id="exam-stats-bar" class="hidden bg-slate-50 border p-3 rounded-xl flex justify-between items-center text-xs">
                            <span id="exam-progress-text" class="font-bold text-slate-700"><i class="fa-solid fa-list-check text-blue-600"></i> 已完成作答：0 / 0 題</span>
                            <button onclick="resetAllQuestionAnswers()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded font-semibold transition"><i class="fa-solid fa-rotate-left"></i> 全頁重測</button>
                        </div>

                        <div id="mistakes-questions-list" class="space-y-4"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal：新增/編輯頁面 -->
    <div id="page-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-96 p-6 border border-slate-200 space-y-4">
            <h3 class="text-base font-bold text-slate-900" id="modal-title">新增頁面</h3>
            <div id="modal-field-main" class="hidden">
                <input type="text" id="input-main-title" placeholder="主頁面名稱 (如: 行政法)" class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div id="modal-field-sub" class="hidden space-y-3">
                <input type="text" id="input-sub-title" placeholder="子頁面名稱 (如: 行政程序法)" class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <div>
                    <label class="text-xs text-slate-500 block mb-1 font-semibold">選擇所屬主頁面：</label>
                    <select id="select-parent-main" class="w-full p-2 border rounded text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closePageModal()" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">取消</button>
                <button onclick="confirmPageModal()" class="px-4 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded font-bold transition">確定新增</button>
            </div>
        </div>
    </div>

    <!-- Modal：匯入法規 -->
    <div id="law-upload-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-[580px] p-6 border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-base font-bold text-slate-900"><i class="fa-solid fa-wand-magic-sparkles text-blue-600"></i> 匯入整篇法規 (自動切割條文)</h3>
                <button onclick="closeLawUploadModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <textarea id="custom-law-text" class="w-full h-52 p-3 border rounded-lg text-xs leading-relaxed" placeholder="例如：&#10;第一章 總則&#10;第 1 條 警察人員執行職務時...&#10;一、為避免非常變故..."></textarea>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button onclick="closeLawUploadModal()" class="px-3 py-1.5 text-xs text-slate-600">取消</button>
                <button onclick="parseAndBatchCreateLaws()" class="px-5 py-1.5 text-xs bg-blue-600 text-white rounded font-bold">自動辨識生成卡片</button>
            </div>
        </div>
    </div>

    <!-- Modal：批量匯入歷屆試題與 PDF 亂碼清理預覽 -->
    <div id="exam-batch-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-[680px] p-6 border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-base font-bold text-slate-900"><i class="fa-solid fa-wand-magic-sparkles text-blue-600"></i> 歷屆試題文字識別與手動修復分行</h3>
                <button onclick="closeExamBatchModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">
                <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> 若上方 PDF 提取的文字出現亂碼，您可以直接在下方框內**修正文字、清理亂碼或將 (A)(B)(C)(D) 選項按 Enter 鍵手動分行**：
            </p>
            <textarea id="custom-exam-text" class="w-full h-72 p-3 border rounded-lg text-xs leading-relaxed font-mono focus:ring-2 focus:ring-blue-500" placeholder="例如：&#10;1 關於警械使用條例之規定，下列何者正確？&#10;(A) 警察人員執行職務時得隨時使用槍械&#10;(B) 使用警械應基於急迫需要&#10;(C)...&#10;(D)..."></textarea>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button onclick="closeExamBatchModal()" class="px-3 py-1.5 text-xs text-slate-600">取消</button>
                <button onclick="parseAndBatchCreateExamQuestions()" class="px-5 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded font-bold transition">自動切割與生成試題</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAe9uqCSGiMoeaa_2NcleMUIfTNhzAjBDo",
            authDomain: "examimindsystem.firebaseapp.com",
            projectId: "examimindsystem",
            storageBucket: "examimindsystem.firebasestorage.app",
            messagingSenderId: "922145488881",
            appId: "1:922145488881:web:af2fc521085321d8e00e50",
            measurementId: "G-ZE1TPG3L7P"
        };

        let db = null;
        let systemData = {
            exams: [{
                id: "police_rank",
                name: "👮‍♂️ 警察升官等考試",
                categories: [{
                    id: "cat_1",
                    title: "警察法規 (專業科目)",
                    subpages: [
                        { id: "sub_1", title: "警械使用條例" },
                        { id: "sub_2", title: "警察法及其細則" }
                    ]
                }]
            }]
        };

        let allLawsMap = {};
        let allNotesMap = {};
        let allExamQuestionsMap = {};
        let allOcrResultsMap = {}; // 🌟 新增：OCR 筆記獨立儲存地圖

        let currentExamIndex = 0;
        let activeSubpageId = "sub_1";
        let currentTab = "tab-law";
        let isBatchSelectMode = false;
        let cardSortable = null, sidebarSortable = null;

        /* 本地記憶備份 */
        function saveToLocalFallback() {
            try {
                localStorage.setItem("em_backup_systemData", JSON.stringify(systemData));
                localStorage.setItem("em_backup_allLawsMap", JSON.stringify(allLawsMap));
                localStorage.setItem("em_backup_allNotesMap", JSON.stringify(allNotesMap));
                localStorage.setItem("em_backup_allExamQuestionsMap", JSON.stringify(allExamQuestionsMap));
                localStorage.setItem("em_backup_allOcrResultsMap", JSON.stringify(allOcrResultsMap));
            } catch(e) {}
        }

        function loadFromLocalFallback() {
            try {
                const s = localStorage.getItem("em_backup_systemData");
                const l = localStorage.getItem("em_backup_allLawsMap");
                const n = localStorage.getItem("em_backup_allNotesMap");
                const q = localStorage.getItem("em_backup_allExamQuestionsMap");
                const o = localStorage.getItem("em_backup_allOcrResultsMap");
                if (s) systemData = JSON.parse(s);
                if (l) allLawsMap = JSON.parse(l);
                if (n) allNotesMap = JSON.parse(n);
                if (q) allExamQuestionsMap = JSON.parse(q);
                if (o) allOcrResultsMap = JSON.parse(o);
            } catch(e) {}
        }

        /* 🌟 全系統跨分頁儲存引擎 */
        async function saveAllToStorage(showAlert = false) {
            syncCurrentPageDOM();
            saveToLocalFallback();

            const statusEl = document.getElementById('cloud-status');
            if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 同步中...`;

            if (!db) {
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-hard-drive text-amber-400"></i> 本機已存`;
                if (showAlert) alert("已儲存至本機瀏覽器。");
                return;
            }

            try {
                await db.collection('exam_data').doc('system_structure').set({
                    systemData: systemData,
                    allNotesMap: allNotesMap,
                    allExamQuestionsMap: allExamQuestionsMap,
                    allOcrResultsMap: allOcrResultsMap,
                    allLawsMap: allLawsMap,
                    lastUpdatedPage: activeSubpageId,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                if (activeSubpageId && allLawsMap[activeSubpageId]) {
                    await db.collection('exam_pages').doc(activeSubpageId).set({
                        htmlContent: allLawsMap[activeSubpageId],
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-cloud-check text-emerald-300"></i> 已同步雲端`;
                if (showAlert) alert("🎉 全站所有分頁資料已成功同步至雲端！");
            } catch (e) {
                console.error("雲端同步失敗：", e);
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400"></i> 傳輸失敗`;
            }
        }

        function syncCurrentPageDOM() {
            const container = document.getElementById('laws-container-inner');
            if (activeSubpageId && container && container.innerHTML.trim() !== "") {
                allLawsMap[activeSubpageId] = container.innerHTML;
                saveToLocalFallback();
            }
        }

        /* 🌟 切換打星星 (重點標記) */
        function toggleStarBadge(btn) {
            const isStarred = btn.classList.contains('is-starred');
            if (isStarred) {
                btn.classList.remove('is-starred', 'bg-amber-100', 'text-amber-700', 'border-amber-300');
                btn.classList.add('bg-slate-50', 'text-slate-400', 'border-slate-200');
                btn.innerHTML = `<i class="fa-regular fa-star"></i> 重點`;
            } else {
                btn.classList.add('is-starred', 'bg-amber-100', 'text-amber-700', 'border-amber-300');
                btn.classList.remove('bg-slate-50', 'text-slate-400', 'border-slate-200');
                btn.innerHTML = `<i class="fa-solid fa-star text-amber-500"></i> 重點`;
            }
            syncCurrentPageDOM();
            refreshQuickIndex();
            saveAllToStorage(false);
        }

        /* 🌟 切換卡片「唯讀 / 編輯」防誤觸狀態 */
        function toggleCardEditMode(btn) {
            const card = btn.closest('.law-card');
            const isReadonly = card.classList.contains('is-readonly');
            const editables = card.querySelectorAll('.law-card-title, .law-item-section span, .law-subitem-section span, .link-item span');

            if (isReadonly) {
                card.classList.remove('is-readonly');
                editables.forEach(el => el.setAttribute('contenteditable', 'true'));
                btn.innerHTML = `<i class="fa-solid fa-check text-emerald-600"></i> 儲存`;
                btn.className = "text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-800 px-2.5 py-1.5 rounded-lg border border-emerald-300 font-bold transition flex items-center gap-1 shadow-sm";
            } else {
                card.classList.add('is-readonly');
                editables.forEach(el => el.setAttribute('contenteditable', 'false'));

                syncCurrentPageDOM();
                refreshQuickIndex();
                saveAllToStorage(false);
            }
        }

        /* 全站智慧搜尋 */
        function triggerGlobalSearch() {
            const input = document.getElementById('global-search-input');
            const keyword = input.value.trim().toLowerCase();
            const panelTitle = document.getElementById('aside-panel-title');
            const listContainer = document.getElementById('quick-index-list');

            if (!keyword) {
                refreshQuickIndex();
                return;
            }

            panelTitle.innerHTML = `<i class="fa-solid fa-magnifying-glass text-blue-600"></i> 搜尋結果 ("${keyword}")`;

            let resultsHTML = '';
            let totalCount = 0;

            Object.keys(allLawsMap).forEach(subId => {
                const subTitle = getSubpageTitleById(subId);
                const parser = new DOMParser();
                const doc = parser.parseFromString(allLawsMap[subId], 'text/html');
                const cards = doc.querySelectorAll('.law-card');

                cards.forEach(card => {
                    const text = card.innerText;
                    if (text.toLowerCase().includes(keyword)) {
                        totalCount++;
                        const cardTitle = card.querySelector('.law-card-title')?.innerText || "法條卡片";
                        resultsHTML += `
                            <div onclick="jumpToSearchResult('${subId}', '${cardTitle}')" class="p-2 border-b border-slate-100 hover:bg-blue-50 rounded cursor-pointer transition space-y-1">
                                <div class="flex justify-between items-center text-[11px] font-bold text-blue-600">
                                    <span>《${subTitle}》</span>
                                    <span class="bg-blue-100 text-blue-700 px-1.5 py-0.2 rounded">法條</span>
                                </div>
                                <div class="font-bold text-slate-800">${cardTitle}</div>
                                <div class="text-[11px] text-slate-500 line-clamp-2">${text.replace(cardTitle, '').trim().substring(0, 70)}...</div>
                            </div>
                        `;
                    }
                });
            });

            if (totalCount === 0) {
                listContainer.innerHTML = `<div class="p-4 text-center text-slate-400 italic">未查找到任何包含「${keyword}」的法規或資訊。</div>`;
            } else {
                listContainer.innerHTML = resultsHTML;
            }
        }

        function getSubpageTitleById(subId) {
            let found = "未知頁面";
            systemData.exams.forEach(e => {
                e.categories.forEach(c => {
                    c.subpages.forEach(s => { if (s.id === subId) found = s.title; });
                });
            });
            return found;
        }

        function jumpToSearchResult(subId, cardTitle) {
            selectSubpage(subId, getSubpageTitleById(subId));
            switchTab('tab-law');
            
            setTimeout(() => {
                const container = document.getElementById('laws-container-inner');
                if (!container) return;
                const cards = container.querySelectorAll('.law-card');
                cards.forEach(card => {
                    if (card.querySelector('.law-card-title')?.innerText === cardTitle) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        card.classList.add('ring-2', 'ring-blue-500');
                        setTimeout(() => card.classList.remove('ring-2', 'ring-blue-500'), 2500);
                    }
                });
            }, 300);
        }

        /* 批量匯入法規全文解析引擎 */
        function parseAndBatchCreateLaws() {
            const rawText = document.getElementById('custom-law-text').value.trim();
            if (!rawText) return alert("請貼上法規全文或條文內容！");

            const lines = rawText.split('\n');
            let parsedElements = [];
            let currentArticle = null;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                const isChapter = /^第\s*[\d\-\u4e00-\u4e5d\u767e\u5343]+\s*[章節編條目]|^總則|^分則/.test(trimmed) && !trimmed.includes('條');
                const isArticleHeader = /^第\s*[\d\-\u4e00-\u4e5d\u767e\u5343]+\s*條/.test(trimmed);

                if (isChapter) {
                    if (currentArticle) { parsedElements.push({ type: 'article', data: currentArticle }); currentArticle = null; }
                    parsedElements.push({ type: 'chapter', title: trimmed });
                } else if (isArticleHeader) {
                    if (currentArticle) { parsedElements.push({ type: 'article', data: currentArticle }); }
                    currentArticle = { title: trimmed, items: [] };
                } else {
                    if (!currentArticle) currentArticle = { title: "匯入條文", items: [] };
                    currentArticle.items.push(trimmed);
                }
            });
            if (currentArticle) parsedElements.push({ type: 'article', data: currentArticle });

            const container = document.getElementById('laws-container-inner');
            container.innerHTML = "";

            parsedElements.forEach(elem => {
                if (elem.type === 'chapter') {
                    const chapHTML = `
                        <div class="chapter-header group cursor-grab">
                            <span class="drag-handle text-slate-300 hover:text-slate-500 mr-2"><i class="fa-solid fa-grip-vertical"></i></span>
                            <span class="chapter-title-text" contenteditable="false" onblur="syncCurrentPageDOM(); refreshQuickIndex();">${elem.title}</span>
                            <button onclick="deleteChapterHeader(this)" title="刪除此章節標題" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 text-xs ml-2 transition"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', chapHTML);
                } else if (elem.type === 'article') {
                    const art = elem.data;
                    let itemsText = art.items.join('<br>');
                    container.insertAdjacentHTML('beforeend', getLawCardHTML(art.title, itemsText || "無內文"));
                }
            });

            allLawsMap[activeSubpageId] = container.innerHTML;
            document.getElementById('custom-law-text').value = "";
            closeLawUploadModal();
            refreshQuickIndex();
            initDragAndDrop();
            saveAllToStorage(true);
        }

        function addLinkToCard(btn) {
            const card = btn.closest('.law-card');
            const linksList = card.querySelector('.card-links-list');
            if (linksList) {
                const isReadonly = card.classList.contains('is-readonly');
                const newLinkHTML = `
                    <div class="link-item flex items-center justify-between bg-slate-50 px-2.5 py-1 rounded border border-slate-200/60">
                        <span contenteditable="${isReadonly ? 'false' : 'true'}" onblur="syncCurrentPageDOM()" class="outline-none">點此輸入新連結或爭點備註...</span>
                        <button onclick="this.closest('.link-item').remove(); syncCurrentPageDOM(); saveAllToStorage(false);" class="section-del-btn text-slate-400 hover:text-red-500 ml-2"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `;
                linksList.insertAdjacentHTML('beforeend', newLinkHTML);
                saveAllToStorage(false);
            }

        /* 刷新右側索引，星號重點法條顯示 ⭐ 標籤 */
        function refreshQuickIndex() {
            document.getElementById('aside-panel-title').innerHTML = `<i class="fa-solid fa-list-ul text-blue-600"></i> 本頁法規索引`;
            const container = document.getElementById('laws-container-inner');
            const indexBox = document.getElementById('quick-index-list');
            if (!container || !indexBox) return;

            const elements = container.querySelectorAll('.chapter-header, .law-card');
            indexBox.innerHTML = Array.from(elements).map((el, i) => {
                el.id = "idx_item_" + i;
                const isChapter = el.classList.contains('chapter-header');
                const titleText = el.querySelector('.law-card-title, .chapter-title-text')?.innerText || "標題";
                const isStarred = el.querySelector('.star-badge-btn')?.classList.contains('is-starred');

                if (isChapter) {
                    return `<div class="font-bold text-slate-800 pt-2 pb-0.5 border-b border-slate-100 truncate">${titleText}</div>`;
                }

                return `
                    <a href="#idx_item_${i}" class="flex items-center justify-between text-slate-600 hover:text-blue-600 truncate py-1 px-1 rounded hover:bg-slate-50 transition">
                        <span class="truncate"><i class="fa-regular fa-file-lines text-[10px] text-slate-400 mr-1.5"></i>${titleText}</span>
                        ${isStarred ? `<span class="text-amber-500 font-bold ml-1 text-xs shrink-0" title="重點法條">⭐</span>` : ''}
                    </a>
                `;
            }).join('') || `<p class="text-slate-400 italic">尚無索引資料...</p>`;
        }

        /* 頁面切換與渲染機制 */
        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('content-' + tabId).classList.remove('hidden');

            ['law', 'ocr', 'notes', 'mistakes'].forEach(t => {
                const btn = document.getElementById('btn-tab-' + t);
                if (btn) {
                    if ('tab-' + t === tabId) {
                        btn.className = "pb-3 border-b-2 border-blue-600 text-blue-600 flex items-center gap-2 font-bold";
                    } else {
                        btn.className = "pb-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-2 text-slate-500 font-semibold";
                    }
                }
            });

            if (tabId === 'ocr') renderOcrTab();
            if (tabId === 'notes') renderNotesTab();
            if (tabId === 'mistakes') renderMistakesTab();
        }

        /* 🌟 分頁 2：講義與 OCR 辨識儲存邏輯 */
        function renderOcrTab() {
            const ocrInput = document.getElementById('ocr-text-result');
            if (ocrInput) {
                ocrInput.value = allOcrResultsMap[activeSubpageId] || "";
            }
        }

        function saveOCRResultText(val) {
            allOcrResultsMap[activeSubpageId] = val;
            saveAllToStorage(false);
        }

        function handleOCRUpload(input) {
            if (input.files && input.files[0]) {
                const resultText = "【OCR 辨識完成】\n警察人員執行職務時，遇有下列各款情形之一者，得使用警械：\n一、為避免非常變故，維持社會秩序時。";
                document.getElementById('ocr-text-result').value = resultText;
                allOcrResultsMap[activeSubpageId] = resultText;
                saveAllToStorage(false);
            }
        }

        function saveOCRToNotes() {
            const txt = document.getElementById('ocr-text-result').value.trim();
            if (!txt) return alert("請先輸入或辨識內容再轉存至個人筆記！");
            if (!allNotesMap[activeSubpageId]) allNotesMap[activeSubpageId] = [];
            allNotesMap[activeSubpageId].unshift({ title: "講義 OCR 摘要筆記", content: txt });
            saveAllToStorage(true);
            alert("已成功轉存入個人筆記！");
            switchTab('tab-notes');
        }

        /* 🌟 分頁 3：個人筆記與爭點儲存邏輯 */
        function renderNotesTab() {
            const container = document.getElementById('note-cards-container');
            const notes = allNotesMap[activeSubpageId] || [];
            if (notes.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-slate-400 text-xs italic text-center py-8">本頁面尚無獨立筆記，請點擊右上角新增。</div>`;
                return;
            }
            container.innerHTML = notes.map((n, index) => `
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2 relative group">
                    <div class="flex justify-between items-center border-b pb-2">
                        <input type="text" value="${n.title}" onchange="updateNoteData(${index}, 'title', this.value)" class="font-bold text-sm text-slate-800 bg-transparent focus:outline-none w-full">
                        <button onclick="deleteNoteCard(${index})" class="text-slate-400 hover:text-red-500 text-xs px-1"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <textarea onchange="updateNoteData(${index}, 'content', this.value)" class="w-full h-28 text-xs text-slate-700 bg-slate-50 p-2 rounded border focus:outline-none resize-none leading-relaxed">${n.content}</textarea>
                </div>
            `).join('');
        }

        function addNewNoteCard() {
            if (!allNotesMap[activeSubpageId]) allNotesMap[activeSubpageId] = [];
            allNotesMap[activeSubpageId].unshift({ title: "新爭點筆記", content: "點此輸入詳細筆記內容與爭點分析..." });
            renderNotesTab();
            saveAllToStorage(false);
        }

        function updateNoteData(index, key, val) {
            if (allNotesMap[activeSubpageId] && allNotesMap[activeSubpageId][index]) {
                allNotesMap[activeSubpageId][index][key] = val;
                saveAllToStorage(false);
            }
        }

        function deleteNoteCard(index) {
            if (confirm("確定要刪除這張筆記卡片嗎？")) {
                allNotesMap[activeSubpageId].splice(index, 1);
                renderNotesTab();
                saveAllToStorage(false);
            }
        }

        /* 🌟 分頁 4：歷屆試題與 PDF 亂碼清理修復引擎 */
        function renderMistakesTab() {
            const container = document.getElementById('mistakes-questions-list');
            const statsBar = document.getElementById('exam-stats-bar');
            const questions = allExamQuestionsMap[activeSubpageId] || [];

            if (questions.length === 0) {
                statsBar.classList.add('hidden');
                container.innerHTML = `<div class="text-slate-400 text-xs italic text-center py-8">本頁面尚無歷屆試題，請點擊上方按鈕上傳考選部 PDF 或文字智能匯入。</div>`;
                return;
            }

            statsBar.classList.remove('hidden');
            let submittedCount = questions.filter(q => q.submitted).length;
            document.getElementById('exam-progress-text').innerHTML = `<i class="fa-solid fa-list-check text-blue-600"></i> 已完成作答：${submittedCount} / ${questions.length} 題`;

            const currentCatSubpages = systemData.exams[currentExamIndex]?.categories[0]?.subpages || [];

        /* 🌟 考選部 PDF 試題抽取與亂碼自動修正引擎 */
        async function handlePDFExamUpload(input) {
            const file = input.files[0];
            if (!file) return;

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let extractedText = '';

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    let lastY = null;
                    let pageLines = [];
                    let currentLine = '';

                    textContent.items.forEach(item => {
                        const currentY = item.transform[5];
                        if (lastY !== null && Math.abs(currentY - lastY) > 6) {
                            pageLines.push(currentLine.trim());
                            currentLine = '';
                        }
                        currentLine += item.str + ' ';
                        lastY = currentY;
                    });
                    if (currentLine) pageLines.push(currentLine.trim());

                    extractedText += pageLines.join('\n') + '\n';
                }

                // 智慧修正 PDF 亂碼與連字
                let formattedText = normalizeTextInlineOptions(extractedText);
                document.getElementById('custom-exam-text').value = formattedText;
                openExamBatchModal();
                input.value = '';
            } catch (e) {
                console.error("PDF 解析失敗：", e);
                alert("PDF 自動提取完成，已跳出編輯視窗，您可以手動刪除亂碼與分行！");
                openExamBatchModal();
            }
        }

        /* 🌟 亂碼轉碼與選項自動分行修復函數 */
        function normalizeTextInlineOptions(rawText) {
            let text = rawText
                .replace(/[\u1680\u180E\u2000-\u200B\u202F\u205F\u3000\uFEFF]/g, ' ')
                // 清理全形與常見亂碼符號，轉回標準 (A)(B)(C)(D)
                .replace(/（\s*([Ａ-Ｄａ-ｄA-Da-d\?])\s*）/g, '($1)')
                .replace(/Ａ/g, 'A').replace(/Ｂ/g, 'B').replace(/Ｃ/g, 'C').replace(/Ｄ/g, 'D')
                .replace(/ａ/g, 'a').replace(/ｂ/g, 'b').replace(/ｃ/g, 'c').replace(/ｄ/g, 'd')
                .replace(/[\(（]\s*\?\s*[\)）]/g, '?')
                // 自動將緊黏的選項換行
                .replace(/([^\n])\s*(\([A-Da-d]\))/g, '$1\n$2')
                .replace(/([^\n])\s*([A-Da-d][\.\、])/g, '$1\n$2');

            let lines = text.split('\n');
            let optionIndexMap = ['(A)', '(B)', '(C)', '(D)'];
            let currentOptIdx = 0;

            lines = lines.map(line => {
                let trimmed = line.trim();
                if (/^第?\s*[0-9\uff10-\uff19]{1,3}\s*題?[\.\、\)\s]/.test(trimmed)) {
                    currentOptIdx = 0;
                    return trimmed;
                }
                if (/^\?\s*/.test(trimmed)) {
                    let fixedSymbol = optionIndexMap[currentOptIdx % 4];
                    currentOptIdx++;
                    return trimmed.replace(/^\?\s*/, fixedSymbol + ' ');
                }
                return trimmed;
            });

            return lines.join('\n');
        }

        function parseAndImportQuestionsText(rawText) {
            if (!rawText.trim()) return alert("未檢測到試題文字內容！");

            let cleanText = normalizeTextInlineOptions(rawText)
                .replace(/代號[：:]\d+/g, '')
                .replace(/頁次[：:]\d+[\/\s]\d+/g, '')
                .replace(/考試時間[：:].*/g, '')
                .replace(/※注意[：:].*/g, '');

            const lines = cleanText.split('\n');
            let questions = [];
            let currentQ = null;

            const questionHeaderRegex = /^第?\s*[0-9\uff10-\uff19]{1,3}\s*題?[\.\、\)\s]/;
            const optionHeaderRegex = /^[\(（][A-Da-d\?][\)）]|^[A-Da-d\?][\.\、\s]/;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (questionHeaderRegex.test(trimmed) && !optionHeaderRegex.test(trimmed)) {
                    if (currentQ && currentQ.options.length > 0) questions.push(currentQ);
                    currentQ = { title: trimmed, options: [], answer: 'A', analysis: '', userChoice: '', submitted: false };
                } else if (currentQ) {
                    if (optionHeaderRegex.test(trimmed)) {
                        currentQ.options.push(trimmed);
                    } else if (currentQ.options.length === 0) {
                        currentQ.title += ' ' + trimmed;
                    } else {
                        currentQ.options[currentQ.options.length - 1] += ' ' + trimmed;
                    }
                }
            });
            if (currentQ && currentQ.options.length > 0) questions.push(currentQ);

            if (questions.length === 0) return alert("未成功拆分題目！請確認文字框內是否包含題號與 (A)(B)(C)(D) 選項標籤。");

            if (!allExamQuestionsMap[activeSubpageId]) allExamQuestionsMap[activeSubpageId] = [];
            allExamQuestionsMap[activeSubpageId] = allExamQuestionsMap[activeSubpageId].concat(questions);

            renderMistakesTab();
            saveAllToStorage(true);
            alert(`🎉 成功解析並匯入 ${questions.length} 道歷屆試題！`);
        }

        function parseAndBatchCreateExamQuestions() {
            const rawText = document.getElementById('custom-exam-text').value.trim();
            if (!rawText) return alert("請貼上考題全文！");

            closeExamBatchModal();
        }

            document.querySelectorAll('.cat-block').forEach(catBlock => {
                const catId = catBlock.getAttribute('data-cat-id');
                const catTitle = catBlock.getAttribute('data-cat-title');
                let newSubpages = [];

                catBlock.querySelectorAll('li[data-sub-id]').forEach(subItem => {
                    newSubpages.push({
                        id: subItem.getAttribute('data-sub-id'),
                        title: subItem.getAttribute('data-sub-title')
                    });
                });

                newCategories.push({
                    id: catId,
                    title: catTitle,
                    subpages: newSubpages
                });
            });

            currentExam.categories = newCategories;
            saveAllToStorage(false);
        }

                        if (doc.exists) {
                            const cloudData = doc.data();
                            if (cloudData.systemData) systemData = cloudData.systemData;
                            if (cloudData.allNotesMap) allNotesMap = cloudData.allNotesMap;
                            if (cloudData.allExamQuestionsMap) allExamQuestionsMap = cloudData.allExamQuestionsMap;
                            if (cloudData.allOcrResultsMap) allOcrResultsMap = cloudData.allOcrResultsMap;

                            if (cloudData.allLawsMap) {
                                Object.keys(cloudData.allLawsMap).forEach(key => {
                                    if (cloudData.allLawsMap[key] && cloudData.allLawsMap[key].trim() !== "") {

            activeSubpageId = subId;

                    container.innerHTML = allLawsMap[subId];

                    try {
                        const doc = await db.collection('exam_pages').doc(subId).get();
                        if (doc.exists && doc.data().htmlContent && doc.data().htmlContent.trim() !== "") {
                            allLawsMap[subId] = doc.data().htmlContent;
                            container.innerHTML = doc.data().htmlContent;
                        } else {
                            container.innerHTML = getLawCardHTML(`《${title}》標題`, "第 1 項：點擊右上角「編輯」開始增修條文內容...");
                        }

                        container.innerHTML = getLawCardHTML(`《${title}》標題`, "第 1 項：點擊右上角「編輯」開始增修條文內容...");
                    }
                } else {
                    container.innerHTML = getLawCardHTML(`《${title}》標題`, "第 1 項：點擊右上角「編輯」開始增修條文內容...");
                }
            }

            refreshQuickIndex();
            updateViewData();
            initDragAndDrop();
            if (currentTab === 'ocr') renderOcrTab();
            if (currentTab === 'notes') renderNotesTab();
            if (currentTab === 'mistakes') renderMistakesTab();
            if(shouldSync) saveAllToStorage(false);
        }

        }

        function confirmPageModal() {
            const currentExam = systemData.exams[currentExamIndex];
            if (!currentExam) return;

            if (modalMode === 'main') {
                const mainTitle = document.getElementById('input-main-title').value.trim();
                if (!mainTitle) return alert("請輸入主頁面名稱！");

                const newCatId = "cat_" + Date.now();
                currentExam.categories.push({
                    id: newCatId,
                    title: mainTitle,
                    subpages: []
                });
                updateViewData();
                saveAllToStorage(true);
                closePageModal();
            } else {
                const subTitle = document.getElementById('input-sub-title').value.trim();
                const parentCatId = document.getElementById('select-parent-main').value;
                if (!subTitle) return alert("請輸入子頁面名稱！");

                const targetCat = currentExam.categories.find(c => c.id === parentCatId);
                if (targetCat) {
                    const newSubId = "sub_" + Date.now();
                    targetCat.subpages.push({
                        id: newSubId,
                        title: subTitle
                    });
                    closePageModal();
                    selectSubpage(newSubId, subTitle);
                    saveAllToStorage(true);
                }
            }
        }

        function editCategoryName(catIdx) {
            const cat = systemData.exams[currentExamIndex].categories[catIdx];
            const newName = prompt("請輸入新的主頁面名稱：", cat.title);
            if (newName && newName.trim()) {
                cat.title = newName.trim();
                updateViewData();
                saveAllToStorage(true);
            }
        }

        function deleteCategory(catIdx) {
            if (confirm("刪除主頁面會連同底下的子頁面一併刪除，確定要刪除嗎？")) {
                systemData.exams[currentExamIndex].categories.splice(catIdx, 1);
                updateViewData();
                saveAllToStorage(true);
            }
        }

        function editSubpageName(catIdx, subIdx) {
            const sub = systemData.exams[currentExamIndex].categories[catIdx].subpages[subIdx];
            const newName = prompt("請輸入新的子頁面名稱：", sub.title);
            if (newName && newName.trim()) {
                sub.title = newName.trim();
                if (sub.id === activeSubpageId) {
                    document.getElementById('current-sublaw-title').innerText = sub.title;
                }
                updateViewData();
                saveAllToStorage(true);
            }
        }

        function deleteSubpage(catIdx, subIdx) {
            if (confirm("確定要刪除此子頁面？")) {
                const sub = systemData.exams[currentExamIndex].categories[catIdx].subpages[subIdx];
                systemData.exams[currentExamIndex].categories[catIdx].subpages.splice(subIdx, 1);
                delete allLawsMap[sub.id];
                delete allNotesMap[sub.id];
                delete allExamQuestionsMap[sub.id];
                delete allOcrResultsMap[sub.id];
                updateViewData();
                saveAllToStorage(true);
            }
        }

        function openLawUploadModal() { document.getElementById('law-upload-modal').classList.remove('hidden'); }
        function closeLawUploadModal() { document.getElementById('law-upload-modal').classList.add('hidden'); }
        function openExamBatchModal() { document.getElementById('exam-batch-modal').classList.remove('hidden'); }
        function closeExamBatchModal() { document.getElementById('exam-batch-modal').classList.add('hidden'); }

        function addNewChapterHeader() {
            const container = document.getElementById('laws-container-inner');
            const chapHTML = `
                <div class="chapter-header group cursor-grab">
                    <span class="drag-handle text-slate-300 hover:text-slate-500 mr-2"><i class="fa-solid fa-grip-vertical"></i></span>
                    <span class="chapter-title-text" contenteditable="true" onblur="syncCurrentPageDOM(); refreshQuickIndex();">新章節標題</span>
                    <button onclick="deleteChapterHeader(this)" title="刪除此章節標題" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 text-xs ml-2 transition"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', chapHTML);
            syncCurrentPageDOM();
            refreshQuickIndex();
            initDragAndDrop();
        }

        function addNewBlankLawCard() {
            const container = document.getElementById('laws-container-inner');
            container.insertAdjacentHTML('beforeend', getLawCardHTML("第 X 條（新條文）", "第 1 項：點擊右上角「編輯」開始增修條文內容..."));
            syncCurrentPageDOM();
            refreshQuickIndex();
            initDragAndDrop();
        }

        function deleteChapterHeader(btn) {
            if(confirm("確定刪除此章節標題？")) {
                btn.closest('.chapter-header').remove();
                syncCurrentPageDOM();
                refreshQuickIndex();
            }
        }

        function deleteLawCard(btn) {
            if(confirm("確定要刪除這張條文卡片？")) {
                btn.closest('.law-card').remove();
                syncCurrentPageDOM();
                refreshQuickIndex();
            }
        }

        function deleteSection(btn) {
            btn.closest('.law-item-section, .law-subitem-section').remove();
            syncCurrentPageDOM();
        }

        function addSectionToCard(btn, type) {
            const card = btn.closest('.law-card');
            const contentBox = card.querySelector('.law-card-content');
            const className = type === 'item' ? 'law-item-section' : 'law-subitem-section';
            const placeholder = type === 'item' ? '第 X 項：內容...' : '一、款內容...';
            
            const html = `
                <div class="${className} group flex justify-between items-start">
                    <span contenteditable="true" onblur="syncCurrentPageDOM()">${placeholder}</span>
                    <button onclick="deleteSection(this)" class="section-del-btn text-slate-400 hover:text-red-500 text-xs px-1"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `;
            contentBox.insertAdjacentHTML('beforeend', html);
            syncCurrentPageDOM();
        }

        function toggleSingleNewLawBadge(btn) {
            btn.classList.toggle('bg-red-500');
            btn.classList.toggle('text-white');
            btn.classList.toggle('bg-red-50');
            btn.classList.toggle('text-red-600');
            syncCurrentPageDOM();
        }

        function toggleBatchSelectMode() {
            isBatchSelectMode = !isBatchSelectMode;
            document.querySelectorAll('.card-select-checkbox').forEach(cb => cb.classList.toggle('hidden', !isBatchSelectMode));
            document.getElementById('batch-actions').classList.toggle('hidden', !isBatchSelectMode);
        }

        function selectAllCards(select) {
            document.querySelectorAll('.card-select-checkbox').forEach(cb => cb.checked = select);
        }

        function deleteSelectedCards() {
            const selected = document.querySelectorAll('.card-select-checkbox:checked');
            if (selected.length === 0) return alert("請先選取要刪除的條文！");
            if (confirm(`確定要刪除選取的 ${selected.length} 個條文卡片？`)) {
                selected.forEach(cb => cb.closest('.law-card').remove());
                syncCurrentPageDOM();
                refreshQuickIndex();
            }
        }

        /* 劃記功能 */
        function applyHighlight(color) {
            const sel = window.getSelection();
            if (!sel.rangeCount || sel.isCollapsed) return;

            let node = sel.anchorNode;
            let card = node.nodeType === 1 ? node.closest('.law-card') : node.parentNode.closest('.law-card');
            if (card && card.classList.contains('is-readonly')) {
                alert("請先點擊該卡片右上角的「✏️ 編輯」按鈕，再進行劃記！");
                return;
            }

            const range = sel.getRangeAt(0);
            const span = document.createElement('span');
            span.className = `highlight-${color}`;
            try {
                range.surroundContents(span);
                syncCurrentPageDOM();
            } catch(e) {
                alert("選取範圍包含多個元素，請單純選擇文字段落進行劃記！");
            }
        }

        function removeHighlight() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            let node = sel.anchorNode;
            
            let card = node.nodeType === 1 ? node.closest('.law-card') : node.parentNode.closest('.law-card');
            if (card && card.classList.contains('is-readonly')) {
                alert("請先點擊該卡片右上角的「✏️ 編輯」按鈕，再清除劃記！");
                return;
            }

            while (node && node !== document.body) {
                if (node.nodeType === 1 && node.className.includes('highlight-')) {
                    const parent = node.parentNode;
                    while (node.firstChild) parent.insertBefore(node.firstChild, node);
                    parent.removeChild(node);
                    syncCurrentPageDOM();
                    break;
                }
                node = node.parentNode;
            }
        }
    </script>
</body>
