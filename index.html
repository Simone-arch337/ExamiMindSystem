<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國家考試智慧備考系統 ExamiMind (極速穩定版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .highlight-yellow { background-color: #fef08a; padding: 2px 4px; border-radius: 4px; }
        .highlight-green { background-color: #bbf7d0; padding: 2px 4px; border-radius: 4px; }
        .highlight-pink { background-color: #fbcfe8; padding: 2px 4px; border-radius: 4px; }
        
        .law-item-section { margin-top: 8px; padding-left: 8px; border-left: 2px solid #cbd5e1; position: relative; }
        .law-subitem-section { margin-top: 4px; padding-left: 20px; color: #334155; position: relative; }
        
        .section-del-btn { opacity: 0; transition: opacity 0.2s; }
        .law-item-section:hover .section-del-btn, .law-subitem-section:hover .section-del-btn { opacity: 1; }

        .chapter-header {
            display: flex;
            align-items: center;
            margin: 28px 0 16px 0;
            color: #1e293b;
            font-weight: 700;
            font-size: 1.05rem;
        }
        .chapter-header::before, .chapter-header::after {
            content: "";
            flex: 1;
            border-bottom: 2px dashed #cbd5e1;
        }
        .chapter-header::before { margin-right: 12px; }
        .chapter-header::after { margin-left: 12px; }

        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <!-- 1. 左側欄：目標考試切換與樹狀選單 -->
        <aside class="w-80 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800">
            
            <div class="p-4 border-b border-slate-800 space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">當前目標考試</label>
                    <span id="cloud-status" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700 flex items-center gap-1">
                        <i class="fa-solid fa-spinner fa-spin"></i> 初始化中
                    </span>
                </div>
                
                <div class="flex gap-1.5">
                    <select id="exam-select" onchange="changeExam(this.value)" class="flex-1 bg-slate-800 text-white font-bold text-xs rounded-lg px-2.5 py-2 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 truncate">
                    </select>
                    <button onclick="addExamType()" title="新增考試種類" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1.5 rounded-lg text-xs transition">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <button onclick="editExamType()" title="修改考試名稱" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1.5 rounded-lg text-xs border border-slate-700 transition">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button onclick="deleteExamType()" title="刪除考試種類" class="bg-slate-800 hover:bg-red-900 text-red-400 px-2 py-1.5 rounded-lg text-xs border border-slate-700 transition">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </div>

            <div class="p-3 border-b border-slate-800/60 bg-slate-950/40 flex flex-col gap-2">
                <div class="flex gap-2">
                    <button onclick="openAddPageModal('main')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1.5 px-2 rounded border border-slate-700 flex items-center justify-center gap-1 transition">
                        <i class="fa-solid fa-folder-plus text-blue-400"></i> 新增主頁面
                    </button>
                    <button onclick="openAddPageModal('sub')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1.5 px-2 rounded border border-slate-700 flex items-center justify-center gap-1 transition">
                        <i class="fa-solid fa-file-circle-plus text-green-400"></i> 新增子頁面
                    </button>
                </div>
                
                <button onclick="saveAllToStorage(true)" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs py-2 rounded transition flex items-center justify-center gap-1.5 shadow-md border border-amber-500">
                    <i class="fa-solid fa-cloud-arrow-up"></i> 儲存並跨裝置同步至雲端
                </button>
            </div>

            <nav class="flex-1 overflow-y-auto p-4 space-y-4 text-sm" id="sidebar-nav">
            </nav>
        </aside>

        <!-- 2. 主內容區 -->
        <main class="flex-1 flex flex-col bg-slate-50 overflow-y-auto" id="main-container">
            
            <div id="student-view" class="flex-1 flex flex-col relative">
                
                <header class="bg-white border-b border-slate-200 px-6 pt-4 pb-0 shadow-sm sticky top-0 z-20">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-3">
                                <span id="current-sublaw-title">請選擇或新增子頁面</span>
                            </h1>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="addNewChapterHeader()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium border border-slate-300 transition flex items-center gap-1.5">
                                <i class="fa-solid fa-heading text-blue-600"></i> 新增章節/分隔標題
                            </button>
                            <button onclick="addNewBlankLawCard()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg text-sm font-medium shadow-sm transition flex items-center gap-1.5">
                                <i class="fa-solid fa-plus text-green-400"></i> 新增空白條文卡片
                            </button>
                            <button onclick="openLawUploadModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition flex items-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> 匯入本頁面法規全文
                            </button>
                        </div>
                    </div>

                    <div class="flex gap-8 border-b border-slate-200 text-sm font-semibold text-slate-600">
                        <button onclick="switchTab('tab-law')" id="btn-tab-law" class="pb-3 border-b-2 border-blue-600 text-blue-600 flex items-center gap-2">
                            <i class="fa-solid fa-gavel"></i> <span id="label-tab-law">1. 法規與條文對照</span>
                        </button>
                        <button onclick="switchTab('tab-ocr')" id="btn-tab-ocr" class="pb-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-file-arrow-up"></i> <span id="label-tab-ocr">2. 講義與 OCR 辨識</span>
                        </button>
                        <button onclick="switchTab('tab-notes')" id="btn-tab-notes" class="pb-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-pen-to-square"></i> <span id="label-tab-notes">3. 個人筆記與爭點</span>
                        </button>
                        <button onclick="switchTab('tab-mistakes')" id="btn-tab-mistakes" class="pb-3 border-b-2 border-transparent hover:text-slate-900 flex items-center gap-2">
                            <i class="fa-solid fa-circle-xmark text-red-500"></i> <span id="label-tab-mistakes">4. 歷屆試題與錯題檢討</span>
                        </button>
                    </div>
                </header>

                <div id="content-tab-law" class="p-6 tab-content flex gap-6">
                    <div class="flex-1 space-y-4" id="laws-card-list">
                        
                        <div class="bg-white/95 backdrop-blur-sm px-4 py-2 rounded-xl border border-slate-200 shadow-md flex items-center justify-between sticky top-[108px] z-10 flex-wrap gap-2">
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-slate-500 font-medium flex items-center gap-1">
                                    <i class="fa-solid fa-highlighter text-amber-500"></i> 劃記：
                                </span>
                                <button onclick="applyHighlight('yellow')" title="劃黃色螢光" class="w-6 h-6 rounded bg-yellow-300 hover:scale-110 transition border border-yellow-400 shadow-sm"></button>
                                <button onclick="applyHighlight('green')" title="劃綠色螢光" class="w-6 h-6 rounded bg-green-300 hover:scale-110 transition border border-green-400 shadow-sm"></button>
                                <button onclick="applyHighlight('pink')" title="劃粉色螢光" class="w-6 h-6 rounded bg-pink-300 hover:scale-110 transition border border-pink-400 shadow-sm"></button>
                                <div class="h-4 w-px bg-slate-200 mx-1"></div>
                                <button onclick="removeHighlight()" title="擦除螢光" class="w-6 h-6 rounded bg-slate-100 hover:bg-red-100 text-slate-500 hover:text-red-600 transition border flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-eraser"></i>
                                </button>
                            </div>

                            <div class="flex items-center gap-2">
                                <button onclick="toggleBatchSelectMode()" id="btn-batch-toggle" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded transition border font-medium flex items-center gap-1">
                                    <i class="fa-regular fa-square-check"></i> 批量刪除管理
                                </button>
                                <div id="batch-actions" class="hidden items-center gap-2">
                                    <button onclick="selectAllCards(true)" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 px-2.5 py-1 rounded border border-blue-200 font-medium">全選</button>
                                    <button onclick="selectAllCards(false)" class="text-xs bg-slate-50 hover:bg-slate-100 text-slate-600 px-2.5 py-1 rounded border border-slate-200 font-medium">取消全選</button>
                                    <button onclick="deleteSelectedCards()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded transition font-bold flex items-center gap-1 shadow-sm">
                                        <i class="fa-solid fa-trash-can"></i> 刪除選取
                                    </button>
                                </div>
                                <button onclick="saveAllToStorage(true)" class="text-xs bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded transition ml-1 font-bold">
                                    <i class="fa-solid fa-cloud-arrow-up"></i> 雲端同步儲存
                                </button>
                            </div>
                        </div>

                        <div id="laws-container-inner" class="space-y-4"></div>
                    </div>

                    <aside class="w-56 bg-white rounded-xl border border-slate-200 p-3.5 shadow-sm space-y-2 h-fit sticky top-[108px] text-xs">
                        <div class="border-b pb-2 flex items-center justify-between text-slate-900 font-bold">
                            <span class="flex items-center gap-1.5"><i class="fa-solid fa-list-ul text-blue-600"></i> 本頁法規索引</span>
                            <button onclick="refreshQuickIndex()" title="重新整理目錄" class="text-slate-400 hover:text-blue-600"><i class="fa-solid fa-rotate-right"></i></button>
                        </div>
                        <div id="quick-index-list" class="space-y-1 max-h-[calc(100vh-200px)] overflow-y-auto pr-1">
                            <p class="text-slate-400 italic">尚無索引資料...</p>
                        </div>
                    </aside>
                </div>

                <div id="content-tab-ocr" class="p-6 space-y-6 tab-content hidden">
                    <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm"><h3 class="font-bold">講義與 OCR 辨識區</h3></div>
                </div>
                <div id="content-tab-notes" class="p-6 space-y-6 tab-content hidden">
                    <div id="note-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                </div>
                <div id="content-tab-mistakes" class="p-6 space-y-6 tab-content hidden">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm"><h3 class="font-bold">歷屆試題檢討區</h3></div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal 彈窗 -->
    <div id="page-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-96 p-6 border border-slate-200 space-y-4">
            <h3 class="text-base font-bold text-slate-900" id="modal-title">新增頁面</h3>
            <div id="modal-field-main" class="hidden"><input type="text" id="input-main-title" placeholder="主頁面名稱 (如: 行政法)" class="w-full p-2 border rounded text-sm"></div>
            <div id="modal-field-sub" class="hidden space-y-3">
                <input type="text" id="input-sub-title" placeholder="子頁面名稱 (如: 行程序法)" class="w-full p-2 border rounded text-sm">
                <select id="select-parent-main" class="w-full p-2 border rounded text-sm bg-slate-50"></select>
            </div>
            <div class="flex justify-end gap-2"><button onclick="closePageModal()" class="px-3 py-1.5 text-xs text-slate-600">取消</button><button onclick="confirmPageModal()" class="px-4 py-1.5 text-xs bg-blue-600 text-white rounded">確定新增</button></div>
        </div>
    </div>

    <div id="law-upload-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl w-[580px] p-6 border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-base font-bold text-slate-900"><i class="fa-solid fa-wand-magic-sparkles text-blue-600"></i> 匯入整篇法規 (自動切割章節、條、項、款)</h3>
                <button onclick="closeLawUploadModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <textarea id="custom-law-text" class="w-full h-52 p-3 border rounded-lg text-xs leading-relaxed" placeholder="例如：&#10;第一章 總則&#10;第 1 條 警察人員執行職務時...&#10;一、為避免非常變故..."></textarea>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button onclick="closeLawUploadModal()" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">取消</button>
                <button onclick="parseAndBatchCreateLaws()" class="px-5 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium rounded shadow-sm">自動辨識生成</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 腳本 -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAe9uqCSGiMoeaa_2NcleMUIfTNhzAjBDo",
            authDomain: "examimindsystem.firebaseapp.com",
            projectId: "examimindsystem",
            storageBucket: "examimindsystem.firebasestorage.app",
            messagingSenderId: "922145488881",
            appId: "1:922145488881:web:af2fc521085321d8e00e50",
            measurementId: "G-ZE1TPG3L7P"
        };

        let db = null;

        let systemData = {
            exams: [
                {
                    id: "police_rank",
                    name: "👮‍♂️ 警察升官等考試",
                    categories: [
                        {
                            id: "cat_1",
                            title: "警察法規 (專業科目)",
                            subpages: [
                                { id: "sub_1", title: "警械使用條例" },
                                { id: "sub_2", title: "警察法及其細則" }
                            ]
                        }
                    ]
                }
            ],
            tabs: { tab1: "1. 法規與條文對照", tab2: "2. 講義與 OCR 辨識", tab3: "3. 個人筆記與爭點", tab4: "4. 歷屆試題與錯題檢討" }
        };

        let allLawsMap = {};
        let currentExamIndex = 0;
        let activeSubpageId = "sub_1";
        let modalMode = "";
        let editingSubId = null;
        let isBatchSelectMode = false;

        function saveToLocalFallback() {
            try {
                localStorage.setItem("em_backup_systemData", JSON.stringify(systemData));
                localStorage.setItem("em_backup_allLawsMap", JSON.stringify(allLawsMap));
            } catch(e) {}
        }

        function loadFromLocalFallback() {
            try {
                const s = localStorage.getItem("em_backup_systemData");
                const l = localStorage.getItem("em_backup_allLawsMap");
                if (s) systemData = JSON.parse(s);
                if (l) allLawsMap = JSON.parse(l);
            } catch(e) {}
        }

        async function saveAllToStorage(showAlert = false) {
            syncCurrentPageDOM();
            saveToLocalFallback();

            const statusEl = document.getElementById('cloud-status');
            if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 同步中...`;

            if (!db) {
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-hard-drive text-amber-400"></i> 本機已存`;
                if (showAlert) alert("已儲存至本機瀏覽器。");
                return;
            }

            try {
                await db.collection('exam_data').doc('system_structure').set({
                    systemData: systemData,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                if (activeSubpageId && allLawsMap[activeSubpageId]) {
                    await db.collection('exam_pages').doc(activeSubpageId).set({
                        htmlContent: allLawsMap[activeSubpageId],
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-cloud-check text-emerald-300"></i> 已同步雲端`;
                if (showAlert) alert("🎉 頁面內容已成功同步至雲端！");
            } catch (e) {
                console.error("雲端分流同步失敗：", e);
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400"></i> 傳輸失敗`;
                alert("❌ 同步失敗！請檢查網路連線或 Firebase Firestore 是否已開啟。");
            }
        }

        function syncCurrentPageDOM() {
            const container = document.getElementById('laws-container-inner');
            if (activeSubpageId && container) {
                allLawsMap[activeSubpageId] = container.innerHTML;
            }
        }

        async function loadSubpageFromCloud(subId) {
            if (!db) return;
            try {
                const doc = await db.collection('exam_pages').doc(subId).get();
                if (doc.exists && doc.data().htmlContent) {
                    allLawsMap[subId] = doc.data().htmlContent;
                }
            } catch(e) {}
        }

        /* 超時自動渲染保護連線 */
        function initApp() {
            loadFromLocalFallback();
            renderExamSelect();
            updateViewData();

            const firstSub = systemData.exams[currentExamIndex]?.categories[0]?.subpages[0];
            if (firstSub) {
                selectSubpage(firstSub.id, firstSub.title, false);
            }

            // 超時安全閥：如果 2 秒內沒連上 Firebase，直接切換至可存取的本機運作模式
            const timeoutTimer = setTimeout(() => {
                const statusEl = document.getElementById('cloud-status');
                if (statusEl && statusEl.innerText.includes("初始化")) {
                    statusEl.innerHTML = `<i class="fa-solid fa-hard-drive text-emerald-300"></i> 系統準備就緒`;
                }
            }, 2000);

            try {
                if (typeof firebase !== 'undefined') {
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    db = firebase.firestore();

                    db.collection('exam_data').doc('system_structure').onSnapshot(doc => {
                        clearTimeout(timeoutTimer);
                        if (doc.exists && doc.data().systemData) {
                            systemData = doc.data().systemData;
                            saveToLocalFallback();
                            renderExamSelect();
                            updateViewData();
                        }
                        const statusEl = document.getElementById('cloud-status');
                        if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-cloud text-emerald-300"></i> 雲端已連線`;
                    }, err => {
                        clearTimeout(timeoutTimer);
                        const statusEl = document.getElementById('cloud-status');
                        if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-hard-drive text-amber-400"></i> 本機模式`;
                    });
                }
            } catch(e) {
                clearTimeout(timeoutTimer);
                const statusEl = document.getElementById('cloud-status');
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-hard-drive text-amber-400"></i> 本機模式`;
            }
        }

        window.onload = function() {
            initApp();
        };

        function renderExamSelect() {
            const select = document.getElementById('exam-select');
            if(select) {
                select.innerHTML = systemData.exams.map((e, index) => `<option value="${index}" ${index == currentExamIndex ? 'selected' : ''}>${e.name}</option>`).join('');
            }
        }

        function changeExam(index) {
            syncCurrentPageDOM();
            currentExamIndex = parseInt(index);
            updateViewData();

            const firstSub = systemData.exams[currentExamIndex]?.categories[0]?.subpages[0];
            if (firstSub) {
                selectSubpage(firstSub.id, firstSub.title, false);
            } else {
                activeSubpageId = null;
                document.getElementById('current-sublaw-title').innerText = "請新增主頁面與子頁面";
                document.getElementById('laws-container-inner').innerHTML = `<div class="text-slate-400 text-sm italic">此考試類別尚無頁面，請點擊左側「新增主頁面」開始建立。</div>`;
            }
            saveAllToStorage(false);
        }

        function addExamType() {
            const name = prompt("請輸入新增的考試種類名稱：", "例如：司法特考三等");
            if (name && name.trim() !== "") {
                const newExam = {
                    id: "exam_" + Date.now(),
                    name: "📘 " + name.trim(),
                    categories: []
                };
                systemData.exams.push(newExam);
                currentExamIndex = systemData.exams.length - 1;
                renderExamSelect();
                changeExam(currentExamIndex);
            }
        }

        function editExamType() {
            const currentExam = systemData.exams[currentExamIndex];
            if (!currentExam) return;
            const newName = prompt("修改當前考試名稱：", currentExam.name);
            if (newName && newName.trim() !== "") {
                currentExam.name = newName.trim();
                renderExamSelect();
                saveAllToStorage(false);
            }
        }

        function deleteExamType() {
            if (systemData.exams.length <= 1) return alert("系統中至少需要保留一個考試種類！");
            const currentExam = systemData.exams[currentExamIndex];
            if (confirm(`確定要刪除考試「${currentExam.name}」及其底下所有的法規卡片嗎？`)) {
                systemData.exams.splice(currentExamIndex, 1);
                currentExamIndex = 0;
                renderExamSelect();
                changeExam(0);
            }
        }

        function updateViewData() {
            const currentExam = systemData.exams[currentExamIndex];

        function parseAndBatchCreateLaws() {
            const rawText = document.getElementById('custom-law-text').value.trim();
            if (!rawText) return alert("請貼上法規全文或上傳檔案！");

            const lines = rawText.split('\n');
            let parsedElements = [];
            let currentArticle = null;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                const isChapter = /^第\s*[\d\-\u4e00-\u4e5d\u767e\u5343]+\s*[章節編條目]|^總則|^分則/.test(trimmed) && !trimmed.includes('條');
                const isArticleHeader = /^第\s*[\d\-\u4e00-\u4e5d\u767e\u5343]+\s*條/.test(trimmed);

                if (isChapter) {
                    if (currentArticle) { parsedElements.push({ type: 'article', data: currentArticle }); currentArticle = null; }
                    parsedElements.push({ type: 'chapter', title: trimmed });
                } else if (isArticleHeader) {
                    if (currentArticle) { parsedElements.push({ type: 'article', data: currentArticle }); }
                    currentArticle = { title: trimmed, items: [] };
                } else {
                    if (!currentArticle) currentArticle = { title: "匯入條文", items: [] };
                    const isSubItem = /^([\u4e00-\u4e5d一二三四五六七八九十]+\s*[\u3001\u002e]|[\uff08\u0028][\u4e00-\u4e5d一二三四五六七八九十0-9]+[\uff09\u0029])/.test(trimmed);
                    currentArticle.items.push({ text: trimmed, type: isSubItem ? 'subitem' : 'item' });
                }
            });
            if (currentArticle) parsedElements.push({ type: 'article', data: currentArticle });

            const container = document.getElementById('laws-container-inner');
            container.innerHTML = "";

            parsedElements.forEach(elem => {
                if (elem.type === 'chapter') {
                    const chapHTML = `
                        <div class="chapter-header group">
                            <span class="chapter-title-text" contenteditable="true" onblur="syncCurrentPageDOM(); refreshQuickIndex();">${elem.title}</span>
                            <button onclick="deleteChapterHeader(this)" title="刪除此章節標題" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 text-xs ml-2 transition"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', chapHTML);
                } else if (elem.type === 'article') {
                    const art = elem.data;
                    let itemsHTML = '';
                    if (art.items.length === 0) {
                        itemsHTML = `<div class="law-item-section group flex justify-between items-start"><span contenteditable="true" onblur="syncCurrentPageDOM()">無內文</span><button onclick="deleteSection(this)" class="section-del-btn text-slate-400 hover:text-red-500 text-xs px-1"><i class="fa-solid fa-xmark"></i></button></div>`;
                    } else {
                        art.items.forEach(it => {
                            const cssClass = it.type === 'subitem' ? 'law-subitem-section' : 'law-item-section';
                            itemsHTML += `<div class="${cssClass} group flex justify-between items-start"><span contenteditable="true" onblur="syncCurrentPageDOM()">${it.text}</span><button onclick="deleteSection(this)" title="刪除此行" class="section-del-btn text-slate-400 hover:text-red-500 text-xs px-1"><i class="fa-solid fa-xmark"></i></button></div>`;
                        });
                    }

                    const cardHTML = `
                        <div class="law-card bg-white rounded-xl border border-slate-200 p-6 shadow-sm hover:border-blue-300 transition relative overflow-hidden space-y-3">
                            <div class="flex justify-between items-start pt-1">
                                <div class="flex items-center gap-2">
                                    <input type="checkbox" class="card-select-checkbox ${isBatchSelectMode ? '' : 'hidden'} w-4 h-4 text-blue-600 rounded">
                                    <h3 class="law-card-title text-lg font-bold text-slate-900 pr-12" contenteditable="true" onblur="syncCurrentPageDOM(); refreshQuickIndex();">${art.title}</h3>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="toggleSingleNewLawBadge(this)" title="標記/取消為近3年新修法" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1.5 rounded-lg border border-red-200 font-medium">
                                        <i class="fa-solid fa-flag"></i> 新修法
                                    </button>
                                    <button onclick="deleteLawCard(this)" title="刪除卡片" class="text-slate-400 hover:text-red-600 hover:bg-red-50 p-1.5 rounded-lg transition">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="law-card-content space-y-1.5 text-sm leading-relaxed text-slate-800">
                                ${itemsHTML}
                            </div>

                            <div class="flex gap-2 pt-2 border-t border-slate-100 text-xs">
                                <button onclick="addSectionToCard(this, 'item')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded font-medium flex items-center gap-1">
                                    <i class="fa-solid fa-plus text-blue-500"></i> 新增「項」
                                </button>
                                <button onclick="addSectionToCard(this, 'subitem')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded font-medium flex items-center gap-1">
                                    <i class="fa-solid fa-plus text-green-500"></i> 新增「款」
                                </button>

                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                }

            allLawsMap[activeSubpageId] = container.innerHTML;
            document.getElementById('custom-law-text').value = "";
            closeLawUploadModal();
            refreshQuickIndex();
            saveAllToStorage(true);
        }

                delete allLawsMap[sub.id];

            editingSubId = null;
            document.getElementById('page-modal').classList.remove('hidden');
            const mainField = document.getElementById('modal-field-main');
            const subField = document.getElementById('modal-field-sub');

            const currentExam = systemData.exams[currentExamIndex];

            parentSelect.innerHTML = currentExam.categories.map(c => `<option value="${c.id}">${c.title}</option>`).join('');

            if (mode === 'main') {
                document.getElementById('modal-title').innerText = '新增主頁面';
                mainField.classList.remove('hidden');
                subField.classList.add('hidden');

                document.getElementById('modal-title').innerText = '新增子頁面';
                subField.classList.remove('hidden');
                mainField.classList.add('hidden');

        }

        function openMoveSubModal(currentCatId, subId = null, subTitle = '') {
            modalMode = 'move_sub';
            editingSubId = subId;
            document.getElementById('page-modal').classList.remove('hidden');
            document.getElementById('modal-field-main').classList.add('hidden');
            document.getElementById('modal-field-sub').classList.remove('hidden');
            document.getElementById('modal-title').innerText = subId ? `調整子頁面位置：${subTitle}` : '新增子頁面';
            document.getElementById('input-sub-title').value = subTitle || '';

            const parentSelect = document.getElementById('select-parent-main');
            parentSelect.innerHTML = systemData.exams[currentExamIndex].categories.map(c => `<option value="${c.id}" ${c.id === currentCatId ? 'selected' : ''}>${c.title}</option>`).join('');
        }

        function closePageModal() { document.getElementById('page-modal').classList.add('hidden'); }

        function confirmPageModal() {
            const currentExam = systemData.exams[currentExamIndex];
            if (modalMode === 'main') {
                const title = document.getElementById('input-main-title').value.trim();
                if (title) currentExam.categories.push({ id: "cat_" + Date.now(), title: title, subpages: [] });
            } else if (modalMode === 'sub' || modalMode === 'move_sub') {
                const subTitle = document.getElementById('input-sub-title').value.trim();
                const targetCatId = document.getElementById('select-parent-main').value;
                if (!subTitle) return alert('請輸入子頁面名稱');

                if (editingSubId) {
                    currentExam.categories.forEach(cat => { cat.subpages = cat.subpages.filter(s => s.id !== editingSubId); });
                }
                const targetCat = currentExam.categories.find(c => c.id === targetCatId);
                if (targetCat) {
                    const newSubId = editingSubId || ("sub_" + Date.now());
                    targetCat.subpages.push({ id: newSubId, title: subTitle });
                    selectSubpage(newSubId, subTitle);
                }
            }
            closePageModal();
            updateViewData();
            saveAllToStorage(false);
        }

        function applyHighlight(color) {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return alert("請先用滑鼠框選法條文字！");
            const range = selection.getRangeAt(0);
            const span = document.createElement("span");
            span.className = "highlight-" + color;
            span.appendChild(range.extractContents());
            range.insertNode(span);
            selection.removeAllRanges();
            saveAllToStorage(false);
        }

        function removeHighlight() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return alert("請用滑鼠框選要取消螢光的範圍！");
            const range = selection.getRangeAt(0);
            const container = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentNode;
            const highlightedSpans = container.querySelectorAll('span[class^="highlight-"]');
            highlightedSpans.forEach(span => {
                if (selection.containsNode(span, true)) {
                    const parent = span.parentNode;
                    while (span.firstChild) parent.insertBefore(span.firstChild, span);
                    parent.removeChild(span);
                }
            });
            selection.removeAllRanges();
            saveAllToStorage(false);
        }
